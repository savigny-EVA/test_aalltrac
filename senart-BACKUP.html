<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EVA Sénart League</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<style>
:root{
  --bg:#080808;
  --bg2:#111111;
  --bg3:#1a1a1a;
  --bg4:#222222;
  --border:rgba(255,255,255,.07);
  --border2:rgba(255,255,255,.14);
  --accent:#E05A3A;
  --accent2:#c44d30;
  --text:#FFFFFF;
  --muted:#666666;
  --muted2:#444444;
  --success:#33CC66;
  --danger:#FF3333;
  --warn:#F5C842;
  --gold:#E05A3A;
  --silver:#C0C0C0;
  --bronze:#CD7F32;
  --blue:#4A8FE8;
  --font:"Barlow Condensed",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
body{display:flex;flex-direction:column}

/* ── TOPBAR ── */
.topbar{height:90px;background:var(--bg2);border-bottom:3px solid var(--accent);display:flex;align-items:center;justify-content:space-between;padding:0 48px;flex-shrink:0}
.topbar-logo{font-size:34px;font-weight:900;letter-spacing:10px;text-transform:uppercase}
.topbar-logo span{color:var(--accent)}
.topbar-meta{display:flex;align-items:center;gap:36px}
.meta-block{display:flex;flex-direction:column;align-items:flex-end}
.meta-label{font-size:12px;font-weight:800;letter-spacing:4px;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.meta-value{font-size:24px;font-weight:900;letter-spacing:5px;text-transform:uppercase;color:var(--text)}
.meta-value.accent{color:var(--accent)}

/* ── LAYOUT ── */
.wrap{flex:1;display:grid;grid-template-columns:1fr 640px;gap:28px;padding:28px 48px;overflow:hidden}
.wrap.has-versus{grid-template-rows:1fr auto}
.panel{background:var(--bg2);border:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;position:relative}
.panel-head{padding:20px 28px;border-bottom:2px solid var(--accent);display:flex;justify-content:space-between;align-items:center;flex-shrink:0;background:linear-gradient(180deg,rgba(224,90,58,.06),transparent)}
.panel-title{font-size:24px;font-weight:900;letter-spacing:6px;text-transform:uppercase}
.panel-title span{color:var(--accent)}
.panel-badge{font-size:13px;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:var(--muted);padding:6px 14px;background:var(--bg3);border:1px solid var(--border)}
.panel-body{flex:1;overflow-y:auto;padding:20px 28px}
.panel-body::-webkit-scrollbar{width:6px}
.panel-body::-webkit-scrollbar-thumb{background:var(--border2)}

/* Right panel : swap views (matches ↔ mvp) */
.right-panel{position:relative}
.right-view{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .5s ease}
.right-view.on{opacity:1;pointer-events:auto}

/* Rotation indicator dots */
.rot-dots{display:flex;gap:6px;align-items:center}
.rot-dot{width:8px;height:8px;background:var(--border2);transition:background .3s}
.rot-dot.on{background:var(--accent)}

/* ── STANDINGS TABLE ── */
.stand-tbl{width:100%;border-collapse:collapse}
.stand-tbl thead tr{border-bottom:2px solid var(--border2)}
.stand-tbl th{padding:14px 8px;color:var(--muted);font-weight:800;letter-spacing:3px;font-size:12px;text-transform:uppercase;text-align:center}
.stand-tbl th.left{text-align:left}
.stand-tbl th.rank{width:56px}
.stand-tbl th.pts{color:var(--accent)}
.stand-tbl tbody tr{border-bottom:1px solid var(--border);transition:background .2s;position:relative}
.stand-tbl tbody tr.top1{background:linear-gradient(90deg,rgba(224,90,58,.22),transparent)}
.stand-tbl tbody tr.top1::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--gold)}
.stand-tbl tbody tr.top2{background:linear-gradient(90deg,rgba(192,192,192,.08),transparent)}
.stand-tbl tbody tr.top2::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--silver)}
.stand-tbl tbody tr.top3{background:linear-gradient(90deg,rgba(205,127,50,.08),transparent)}
.stand-tbl tbody tr.top3::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--bronze)}
.stand-tbl tbody tr.last{background:linear-gradient(90deg,rgba(255,51,51,.08),transparent)}
.stand-tbl tbody tr.last::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--danger)}
.stand-tbl td{padding:16px 8px;font-weight:700;font-size:20px;text-align:center}
.stand-tbl td.rank{color:var(--muted);font-weight:900;font-size:26px}
.stand-tbl td.rank.g1{color:var(--gold)}
.stand-tbl td.rank.g2{color:var(--silver)}
.stand-tbl td.rank.g3{color:var(--bronze)}
.stand-tbl td.team{text-align:left;font-weight:800;letter-spacing:1px;font-size:20px}
.team-cell{display:flex;align-items:center;gap:14px}
.team-logo{width:50px;height:50px;flex-shrink:0;background-size:contain;background-repeat:no-repeat;background-position:center;background-color:var(--bg3);border:1px solid var(--border)}
.team-logo.placeholder{background:var(--bg4);border:1px dashed var(--border2);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--accent);letter-spacing:1px;font-weight:900}
.stand-tbl td.w{color:var(--success)}
.stand-tbl td.l{color:var(--danger)}
.stand-tbl td.maps{color:var(--muted);font-size:17px}
.stand-tbl td.pts{color:var(--accent);font-weight:900;font-size:28px}
.stand-tbl td.diff.pos{color:var(--success)}
.stand-tbl td.diff.neg{color:var(--danger)}
.promo-tag{display:inline-block;font-size:10px;font-weight:900;letter-spacing:2px;padding:2px 6px;margin-left:8px;text-transform:uppercase;vertical-align:middle}
.promo-up{background:rgba(51,204,102,.15);border:1px solid var(--success);color:var(--success)}
.promo-down{background:rgba(255,51,51,.15);border:1px solid var(--danger);color:var(--danger)}

/* ── MATCHS ── */
.match-list{display:flex;flex-direction:column;gap:14px}
.match-card{background:var(--bg3);border:1px solid var(--border);padding:16px 18px;transition:border-color .2s;position:relative}
.match-card.played{border-left:4px solid var(--accent);opacity:.88}
.match-card.live{border-left:4px solid var(--warn);animation:pulseBorder 2s infinite}
.match-card.forfeit{border-left:4px solid var(--warn)}
.match-card.forfeit .match-status{color:var(--warn);background:rgba(245,200,66,.08)}
.match-card.forfeit .match-team.winner .tscore{color:var(--success);font-size:28px}
@keyframes pulseBorder{0%,100%{border-left-color:var(--warn)}50%{border-left-color:var(--accent)}}
.match-card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.match-date{font-size:12px;font-weight:800;letter-spacing:3px;color:var(--muted);text-transform:uppercase}
.match-status{font-size:11px;font-weight:900;letter-spacing:3px;text-transform:uppercase;padding:3px 8px;border:1px solid currentColor}
.match-status.done{color:var(--success)}
.match-status.pend{color:var(--muted)}
.match-status.live{color:var(--warn);background:rgba(245,200,66,.08)}
.match-teams{display:grid;grid-template-columns:1fr 60px 1fr;align-items:center;gap:10px}
.match-team{display:flex;align-items:center;padding:12px 16px;background:var(--bg4);border:1px solid var(--border);gap:12px;min-height:64px}
.match-team.left{flex-direction:row}
.match-team.right{flex-direction:row-reverse}
.match-team .mlogo{width:44px;height:44px;flex-shrink:0;background-size:contain;background-repeat:no-repeat;background-position:center;background-color:var(--bg3);border:1px solid var(--border)}
.match-team .mlogo.placeholder{background:var(--bg2);border:1px dashed var(--border2);display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:12px;font-weight:900}
.match-team .tname{font-weight:900;letter-spacing:2px;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;text-transform:uppercase}
.match-team.right .tname{text-align:right}
.match-team .tscore{font-weight:900;font-size:36px;color:var(--muted);min-width:40px;text-align:center;line-height:1}
.match-team.winner{border-color:var(--accent);background:rgba(224,90,58,.12)}
.match-team.winner .tscore{color:var(--accent)}
.match-team.winner .tname{color:var(--text)}
.match-vs{text-align:center;font-size:14px;font-weight:900;letter-spacing:3px;color:var(--muted)}

/* Maps BO3 row */
.match-maps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.map-row{background:var(--bg4);border:1px solid var(--border);padding:8px 10px;display:flex;flex-direction:column;gap:3px;align-items:center}
.map-row .ml{font-size:10px;font-weight:800;letter-spacing:2px;color:var(--muted);text-transform:uppercase}
.map-row .mp-line{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800}
.map-row .mp.a,.map-row .mp.b{color:var(--text)}
.map-row .mp-sep{color:var(--muted);font-size:12px}
.map-row.winA{border-color:rgba(224,90,58,.4);background:linear-gradient(180deg,rgba(224,90,58,.1),var(--bg4))}
.map-row.winA .mp.a{color:var(--accent);font-weight:900;font-size:17px}
.map-row.winB{border-color:rgba(224,90,58,.4);background:linear-gradient(180deg,rgba(224,90,58,.1),var(--bg4))}
.map-row.winB .mp.b{color:var(--accent);font-weight:900;font-size:17px}
.map-row.empty .mp-line{color:var(--muted);font-size:12px}

/* ── MVP VIEW ── */
.mvp-top{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:14px;margin-bottom:16px}
.mvp-card{background:var(--bg3);border:1px solid var(--border);padding:18px 14px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;position:relative}
.mvp-card.p1{border-top:4px solid var(--gold);transform:translateY(-10px)}
.mvp-card.p2{border-top:4px solid var(--silver)}
.mvp-card.p3{border-top:4px solid var(--bronze)}
.mvp-pos{font-size:14px;font-weight:900;letter-spacing:4px;text-transform:uppercase}
.mvp-card.p1 .mvp-pos{color:var(--gold)}
.mvp-card.p2 .mvp-pos{color:var(--silver)}
.mvp-card.p3 .mvp-pos{color:var(--bronze)}
.mvp-pseudo{font-size:24px;font-weight:900;letter-spacing:2px;text-transform:uppercase;line-height:1.1}
.mvp-card.p1 .mvp-pseudo{font-size:28px}
.mvp-team{font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase}
.mvp-kda{display:flex;gap:8px;align-items:center;margin-top:6px;font-weight:800;font-size:18px}
.mvp-kda .k{color:var(--success)}
.mvp-kda .d{color:var(--danger)}
.mvp-kda .a{color:var(--accent)}
.mvp-kda .sep{color:var(--muted);font-size:14px}
.mvp-score{font-size:11px;color:var(--muted);letter-spacing:2px}
.mvp-score b{color:var(--accent);font-weight:900}

.mvp-public{background:linear-gradient(135deg,rgba(74,143,232,.1),var(--bg3));border:1px solid var(--blue);padding:20px 18px;display:flex;align-items:center;gap:20px}
.mvp-public .pub-label{font-size:12px;font-weight:900;letter-spacing:4px;color:var(--blue);text-transform:uppercase}
.mvp-public .pub-name{font-size:24px;font-weight:900;letter-spacing:2px;text-transform:uppercase;margin-top:4px}
.mvp-public .pub-team{font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-top:2px}
.mvp-public .pub-meta{flex:1}
.mvp-public .pub-votes{font-size:28px;font-weight:900;color:var(--blue);text-align:right;line-height:1}
.mvp-public .pub-votes-label{font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;text-align:right;margin-top:2px}

.mvp-qr{display:flex;align-items:center;gap:16px;margin-top:16px;padding:14px;background:var(--bg3);border:1px dashed var(--border2)}
.mvp-qr img{width:100px;height:100px;background:#fff;padding:6px}
.mvp-qr-text{flex:1}
.mvp-qr-text .title{font-size:14px;font-weight:900;letter-spacing:3px;text-transform:uppercase;color:var(--accent)}
.mvp-qr-text .sub{font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-top:4px}
.mvp-qr-text .closed{color:var(--danger)}
.mvp-qr-text .open{color:var(--success)}

/* ── EVA VERSUS BAR ── */
.versus-bar{grid-column:1/-1;background:linear-gradient(90deg,rgba(224,90,58,.25),var(--bg2) 30%,var(--bg2) 70%,rgba(224,90,58,.25));border:2px solid var(--accent);padding:20px 40px;display:flex;align-items:center;justify-content:space-between;gap:40px}
.vs-side{display:flex;align-items:center;gap:24px;flex:1}
.vs-side.right{justify-content:flex-end}
.vs-logo-big{width:90px;height:90px;background-size:contain;background-repeat:no-repeat;background-position:center;background-color:var(--bg3);border:2px solid var(--border);flex-shrink:0}
.vs-logo-big.eva{border-color:var(--accent)}
.vs-meta{display:flex;flex-direction:column}
.vs-meta .vs-label{font-size:11px;font-weight:800;letter-spacing:4px;color:var(--muted);text-transform:uppercase}
.vs-meta .vs-name{font-size:26px;font-weight:900;letter-spacing:3px;text-transform:uppercase;margin-top:2px}
.vs-meta .vs-sub{font-size:12px;font-weight:700;letter-spacing:3px;color:var(--muted);text-transform:uppercase;margin-top:4px}
.vs-center{display:flex;flex-direction:column;align-items:center;padding:0 20px}
.vs-center .vs-vs{font-size:38px;font-weight:900;letter-spacing:6px;color:var(--accent);line-height:1}
.vs-center .vs-date{font-size:12px;font-weight:800;letter-spacing:3px;color:var(--muted);margin-top:4px;text-transform:uppercase}
.vs-center .vs-game{font-size:11px;font-weight:800;letter-spacing:2px;color:var(--warn);margin-top:4px;text-transform:uppercase}

/* ── EMPTY ── */
.empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:14px;letter-spacing:2px;text-transform:uppercase;font-weight:700}

/* ── STATUS ── */
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--success);display:inline-block;margin-right:6px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ── RESPONSIVE ── */
@media (max-width: 1200px){
  .wrap{grid-template-columns:1fr;grid-template-rows:1fr 1fr}
  .wrap.has-versus{grid-template-rows:1fr 1fr auto}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-logo">EVA <span>SÉNART</span> LEAGUE</div>
  <div class="topbar-meta">
    <div class="meta-block">
      <div class="meta-label">Période</div>
      <div class="meta-value" id="meta-month">—</div>
    </div>
    <div class="meta-block">
      <div class="meta-label">Division</div>
      <div class="meta-value accent" id="meta-division">—</div>
    </div>
    <div class="meta-block">
      <div class="meta-label"><span class="status-dot"></span>LIVE</div>
      <div class="meta-value" id="meta-clock">--:--</div>
    </div>
  </div>
</div>

<div class="wrap" id="wrap">

  <!-- CLASSEMENT -->
  <div class="panel">
    <div class="panel-head">
      <div class="panel-title"><span>//</span> Classement</div>
      <div class="panel-badge" id="std-count">0 équipes</div>
    </div>
    <div class="panel-body">
      <table class="stand-tbl">
        <thead>
          <tr>
            <th class="rank">#</th>
            <th class="left">Équipe</th>
            <th>V-D</th>
            <th>MAPS</th>
            <th>+/-</th>
            <th class="pts">PTS</th>
          </tr>
        </thead>
        <tbody id="standings-body">
          <tr><td colspan="6" class="empty" style="padding:40px">Aucune équipe</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- PANNEAU DROIT (rotation matchs ↔ MVP) -->
  <div class="panel right-panel">
    <div class="panel-head">
      <div class="panel-title" id="right-title"><span>//</span> Matchs BO3</div>
      <div class="rot-dots">
        <span class="rot-dot on" id="dot-0"></span>
        <span class="rot-dot" id="dot-1"></span>
      </div>
    </div>
    <div class="panel-body" style="padding:0">
      <!-- View 0 : Matchs -->
      <div class="right-view on" id="view-matches">
        <div class="panel-body" style="padding:20px 28px">
          <div class="match-list" id="matches-list">
            <div class="empty">Aucun match</div>
          </div>
        </div>
      </div>
      <!-- View 1 : MVP -->
      <div class="right-view" id="view-mvp">
        <div class="panel-body" style="padding:20px 28px">
          <div id="mvp-top3-wrap">
            <div class="empty">Aucun MVP défini</div>
          </div>
          <div id="mvp-public-wrap"></div>
          <div id="mvp-qr-wrap"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- EVA VERSUS (affiché dynamiquement en bas si actif) -->
  <div class="versus-bar" id="versus-bar" style="display:none">
    <div class="vs-side left">
      <div class="vs-logo-big eva" id="vs-logo-eva"></div>
      <div class="vs-meta">
        <div class="vs-label">Domicile</div>
        <div class="vs-name" style="color:var(--accent)">EVA SAVIGNY</div>
        <div class="vs-sub">Seine-et-Marne</div>
      </div>
    </div>
    <div class="vs-center">
      <div class="vs-vs">VS</div>
      <div class="vs-date" id="vs-date">—</div>
      <div class="vs-game" id="vs-game" style="display:none">—</div>
    </div>
    <div class="vs-side right">
      <div class="vs-meta" style="align-items:flex-end;text-align:right">
        <div class="vs-label">Adversaire</div>
        <div class="vs-name" id="vs-team">—</div>
        <div class="vs-sub" id="vs-city">—</div>
      </div>
      <div class="vs-logo-big" id="vs-logo"></div>
    </div>
  </div>

</div>

<script>
const firebaseConfig={apiKey:"AIzaSyCledoOZLCns1tBxGO3OIhcsjvFpBFYCss",authDomain:"savigny-cups.firebaseapp.com",databaseURL:"https://savigny-cups-default-rtdb.europe-west1.firebasedatabase.app",projectId:"savigny-cups",storageBucket:"savigny-cups.firebasestorage.app",messagingSenderId:"1000985455974",appId:"1:1000985455974:web:14ea84601120553d7ceca7"};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();
const lgRef=db.ref('league');

/* ── CLOCK ── */
function updateClock(){
  const d=new Date();
  const h=String(d.getHours()).padStart(2,'0');
  const m=String(d.getMinutes()).padStart(2,'0');
  document.getElementById('meta-clock').textContent=h+':'+m;
}
updateClock();
setInterval(updateClock,30000);

/* ── STATE ── */
let currentSplit = null;    // the active split object
let currentMonthKey = null; // YYYY-MM of the month we're displaying
let currentMonth = null;    // the active month object
let currentDivision = null; // division number (1-4) of the current month
let teamsById = {};         // id -> team object (for the current division)
let isMatchDay = false;     // true if today's date matches the first monday of the current month

const MONTH_NAMES = {
  '01':'Janvier','02':'Février','03':'Mars','04':'Avril','05':'Mai','06':'Juin',
  '07':'Juillet','08':'Août','09':'Septembre','10':'Octobre','11':'Novembre','12':'Décembre'
};
const SPLIT_MONTHS = {
  1: ['01','02','03','04'],
  2: ['05','06','07','08','09'],
};
// Which Monday index (0-based) each division plays on
const DIV_MONDAY_INDEX = { 4:0, 3:1, 2:2, 1:3 };
// Inverse: Monday index → division
const MONDAY_DIV = [4, 3, 2, 1];

function mondaysOfMonth(year, monthNum){
  const res = [];
  const y = Number(year), m = Number(monthNum);
  if(!y || !m || m < 1 || m > 12) return res;
  const d = new Date(y, m-1, 1);
  if(isNaN(d.getTime())) return res;
  let g = 0;
  while(d.getDay() !== 1 && g++ < 31) d.setDate(d.getDate()+1);
  g = 0;
  while(d.getMonth() === m-1 && res.length < 4 && g++ < 10){
    res.push(new Date(d));
    d.setDate(d.getDate()+7);
  }
  return res;
}
function initials(name){
  if(!name) return '?';
  const parts = String(name).trim().split(/\s+/).slice(0,2);
  return parts.map(p=>(p[0]||'').toUpperCase()).join('') || String(name)[0].toUpperCase();
}
function normalizeArray(v){
  if(!v) return [];
  if(Array.isArray(v)) return v;
  if(typeof v === 'object'){
    const arr = [];
    Object.keys(v).forEach(k => { const n = Number(k); if(!isNaN(n)) arr[n] = v[k]; });
    return arr;
  }
  return [];
}

/* ── LISTENER ── */
lgRef.on('value', snap => {
  try {
    const data = snap.val() || {};
    const cur = data.current;
    let year = null, split = null;
    if(cur && typeof cur === 'object' && cur.year && cur.split){
      year = Number(cur.year); split = Number(cur.split);
    } else if(data.seasons){
      // Fallback: pick the latest year's latest split
      const years = Object.keys(data.seasons).map(Number).filter(n => !isNaN(n)).sort();
      if(years.length){
        const y = years[years.length-1];
        const splits = data.seasons[y]?.splits || {};
        if(splits.s2) { year = y; split = 2; }
        else if(splits.s1) { year = y; split = 1; }
      }
    }
    if(!year || !split){ renderNothing(); renderVersus(data.versus || {}); return; }

    const sp = data.seasons?.[year]?.splits?.['s'+split];
    if(!sp){ renderNothing(); renderVersus(data.versus || {}); return; }

    currentSplit = sp;

    // Determine which month to display based on today's date
    const today = new Date();
    const curY = today.getFullYear(), curMn = String(today.getMonth()+1).padStart(2,'0');
    const splitMonths = SPLIT_MONTHS[split] || [];

    let chosenKey = null;
    if(curY === year && splitMonths.includes(curMn)){
      chosenKey = year + '-' + curMn;
    } else {
      const keys = Object.keys(sp.months || {}).sort();
      if(keys.length){
        chosenKey = keys[keys.length-1];
      } else if(splitMonths.length){
        chosenKey = year + '-' + splitMonths[0];
      }
    }
    currentMonthKey = chosenKey;
    currentMonth = chosenKey ? (sp.months?.[chosenKey] || null) : null;

    // Determine today's division based on Monday index inside current month
    isMatchDay = false;
    currentDivision = null;
    if(currentMonthKey){
      const y2 = Number(currentMonthKey.slice(0,4));
      const m2 = currentMonthKey.slice(-2);
      const mondays = mondaysOfMonth(y2, m2);
      // Is today one of the 4 Mondays?
      const todayStr = today.toDateString();
      const mondayIdx = mondays.findIndex(mn => mn.toDateString() === todayStr);
      if(mondayIdx >= 0 && mondayIdx < MONDAY_DIV.length){
        isMatchDay = true;
        currentDivision = MONDAY_DIV[mondayIdx];
      } else {
        // Not a match day. Pick last Monday that passed, else first upcoming one.
        // Prefer the division whose Monday most recently passed.
        let lastPassed = -1;
        mondays.forEach((mn, i) => { if(today >= mn) lastPassed = i; });
        if(lastPassed >= 0 && lastPassed < MONDAY_DIV.length){
          currentDivision = MONDAY_DIV[lastPassed];
        } else {
          currentDivision = MONDAY_DIV[0]; // default to D4 (1st Monday)
        }
      }
    }

    // Build teamsById for current division
    teamsById = {};
    if(currentDivision){
      const divs = sp.divisions || {};
      const divKey = 'd' + currentDivision;
      const teamIds = normalizeArray(divs[divKey]);
      teamIds.forEach(id => {
        const team = sp.teams?.[id];
        if(team && team.active !== false) teamsById[id] = team;
      });
    }

    renderActive();
    renderVersus(data.versus || {});
  } catch(e){
    console.error('[senart] render error', e);
  }
});

function monthLabel(mn, y){
  return (MONTH_NAMES[mn] || mn).toUpperCase() + ' ' + y;
}

function renderNothing(){
  document.getElementById('meta-month').textContent='—';
  document.getElementById('meta-division').textContent='—';
  document.getElementById('standings-body').innerHTML='<tr><td colspan="6" class="empty" style="padding:40px">Aucun split actif</td></tr>';
  document.getElementById('matches-list').innerHTML='<div class="empty">Aucun match</div>';
  document.getElementById('std-count').textContent='0 équipes';
  renderMVPView(null);
}

/* ── RENDER ACTIVE ── */
function renderActive(){
  if(!currentSplit || !currentMonthKey){ renderNothing(); return; }
  const mn = currentMonthKey.slice(-2);
  const y = currentMonthKey.slice(0,4);

  // Decide view: match-day → focused division. Else → overall 4 divisions view.
  if(isMatchDay){
    renderMatchDayView(y, mn);
  } else {
    renderOverallView(y, mn);
  }
}

function renderMatchDayView(y, mn){
  // Restore layout for single-division view
  document.body.classList.remove('overall-mode');
  document.getElementById('meta-month').textContent = monthLabel(mn, y);
  document.getElementById('meta-division').textContent = 'DIV '+(currentDivision||'?');

  const divMonth = currentMonth?.divisions?.['d'+currentDivision] || null;
  const teamsArr = Object.values(teamsById);
  const matchesArr = Object.values(divMonth?.matches || {})
    .filter(m => teamsById[m.teamA] && teamsById[m.teamB]);
  document.getElementById('std-count').textContent = teamsArr.length+' équipe'+(teamsArr.length>1?'s':'');

  renderStandings(teamsArr, matchesArr);
  renderMatches(matchesArr, teamsById);
  renderMVPView(divMonth);
}

function renderOverallView(y, mn){
  // Show all 4 divisions' standings at once, no live matches
  document.body.classList.add('overall-mode');
  document.getElementById('meta-month').textContent = monthLabel(mn, y);
  document.getElementById('meta-division').textContent = 'CLASSEMENT GÉNÉRAL';

  const divs = currentSplit?.divisions || {};
  const months = currentMonth || {};

  // Build 4 blocks
  const divColors = { 1:'var(--accent)', 2:'#F5C842', 3:'#4A8FE8', 4:'#33CC66' };
  const blocks = [1,2,3,4].map(divNum => {
    const divKey = 'd'+divNum;
    const teamIds = normalizeArray(divs[divKey]);
    const localTeamsById = {};
    teamIds.forEach(id => {
      const t = currentSplit.teams?.[id];
      if(t && t.active !== false) localTeamsById[id] = t;
    });
    const teamsArr = Object.values(localTeamsById);
    const divMonth = months.divisions?.[divKey] || {};
    const matches = Object.values(divMonth.matches || {})
      .filter(m => localTeamsById[m.teamA] && localTeamsById[m.teamB]);
    const standings = computeStandingsFor(teamsArr, matches);
    const color = divColors[divNum];

    const rows = standings.map((s, i) => {
      const c = i===0?color:(i===standings.length-1?'var(--danger)':'var(--muted2)');
      const logo = s.logo
        ? `<div style="width:20px;height:20px;background-image:url('${s.logo.replace(/'/g,'&#39;')}');background-size:contain;background-repeat:no-repeat;background-position:center;flex-shrink:0"></div>`
        : `<div style="width:20px;height:20px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:var(--muted);flex-shrink:0">${initials(s.name)}</div>`;
      return `
        <div style="display:grid;grid-template-columns:20px 20px 1fr auto auto;gap:8px;align-items:center;padding:6px 10px;border-left:2px solid ${c}">
          <div style="font-size:14px;font-weight:900;color:${i===0?color:'var(--muted)'};text-align:center">${i+1}</div>
          ${logo}
          <div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${(s.name||'').replace(/</g,'&lt;')}</div>
          <div style="font-size:11px;color:var(--muted);font-weight:700">${s.wins}-${s.losses}</div>
          <div style="font-size:14px;font-weight:900;color:${color}">${s.pts}</div>
        </div>`;
    }).join('') || `<div style="color:var(--muted);font-size:11px;padding:14px;text-align:center">Aucune équipe</div>`;

    return `
      <div style="background:var(--bg2);border:1px solid var(--border);border-top:3px solid ${color};padding:14px">
        <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:10px">
          <div style="font-size:13px;font-weight:900;letter-spacing:3px;color:${color}">DIVISION ${divNum}</div>
          <div style="flex:1"></div>
          <div style="font-size:10px;color:var(--muted);letter-spacing:1px">${matches.filter(m=>m.played).length}/${matches.length} joués</div>
        </div>
        ${rows}
      </div>`;
  }).join('');

  const box = document.getElementById('standings-body');
  const tableEl = box?.closest('table');
  if(tableEl){
    // Replace entire standings card content with our overall grid
    const card = tableEl.closest('.card') || tableEl.parentElement;
    let grid = document.getElementById('overall-grid');
    if(!grid){
      grid = document.createElement('div');
      grid.id = 'overall-grid';
      grid.style.cssText = 'display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:4px';
      tableEl.style.display = 'none';
      (card || tableEl.parentElement).appendChild(grid);
    }
    tableEl.style.display = 'none';
    grid.style.display = 'grid';
    grid.innerHTML = blocks;
  }
  document.getElementById('std-count').textContent = '4 divisions';
  // Clear matches list during overall view
  const mList = document.getElementById('matches-list');
  if(mList) mList.innerHTML = '<div class="empty" style="padding:40px;text-align:center;color:var(--muted);font-size:13px;letter-spacing:2px">PROCHAIN LUNDI — DIV '+(nextDivisionToPlay()||'?')+'</div>';
  renderMVPView(null);
}

/* Helper: compute standings for a team set and match list */
function computeStandingsFor(teams, matches){
  const stats = {};
  teams.forEach(t => {
    stats[t.id] = {id:t.id, name:t.name, logo:t.logo, wins:0, losses:0, mapsW:0, mapsL:0, roundsFor:0, roundsAgainst:0};
  });
  matches.forEach(m => {
    if(!m || !m.played) return;
    if(!stats[m.teamA] || !stats[m.teamB]) return;
    const A = stats[m.teamA], B = stats[m.teamB];
    if(m.forfeit && m.forfeit !== 'none'){
      if(m.forfeit === 'B'){ A.wins++; B.losses++; }
      else if(m.forfeit === 'A'){ B.wins++; A.losses++; }
      return;
    }
    const mapsA = (m.maps||[]).filter(x => x && (x.scoreA||0) > (x.scoreB||0)).length;
    const mapsB = (m.maps||[]).filter(x => x && (x.scoreB||0) > (x.scoreA||0)).length;
    A.mapsW += mapsA; A.mapsL += mapsB;
    B.mapsW += mapsB; B.mapsL += mapsA;
    (m.maps||[]).forEach(x => {
      if(!x) return;
      A.roundsFor += Number(x.scoreA||0); A.roundsAgainst += Number(x.scoreB||0);
      B.roundsFor += Number(x.scoreB||0); B.roundsAgainst += Number(x.scoreA||0);
    });
    if(mapsA > mapsB){ A.wins++; B.losses++; }
    else if(mapsB > mapsA){ B.wins++; A.losses++; }
  });
  const arr = Object.values(stats);
  arr.forEach(s => {
    s.mapDiff = s.mapsW - s.mapsL;
    s.roundDiff = s.roundsFor - s.roundsAgainst;
    s.pts = s.wins * 3;
  });
  arr.sort((a,b) => b.wins-a.wins || b.mapDiff-a.mapDiff || b.roundDiff-a.roundDiff || (a.name||'').localeCompare(b.name||''));
  return arr;
}

/* Helper: which division plays next (after today) */
function nextDivisionToPlay(){
  if(!currentMonthKey) return null;
  const y = Number(currentMonthKey.slice(0,4));
  const mn = currentMonthKey.slice(-2);
  const mondays = mondaysOfMonth(y, mn);
  const today = new Date();
  for(let i=0;i<mondays.length;i++){
    if(mondays[i] > today) return MONDAY_DIV[i];
  }
  return null;
}

// Backwards-compatibility shim (some code might still call renderSeason)
function renderSeason(){ renderActive(); }

/* ── STANDINGS ── */
function renderStandings(teams, matches){
  // Switching back from overall view: hide overall grid, show table again
  const overallGrid = document.getElementById('overall-grid');
  if(overallGrid) overallGrid.style.display = 'none';
  const tbody0 = document.getElementById('standings-body');
  const tableEl = tbody0?.closest('table');
  if(tableEl) tableEl.style.display = '';

  const stats = {};
  teams.forEach(t => {
    stats[t.id] = {id:t.id,name:t.name,logo:t.logo,wins:0,losses:0,mapsW:0,mapsL:0,roundsFor:0,roundsAgainst:0};
  });
  matches.forEach(m => {
    if(!m || !m.played) return;
    if(!stats[m.teamA] || !stats[m.teamB]) return;
    const A = stats[m.teamA], B = stats[m.teamB];

    // FORFEIT: no map-level stats, just W-L
    if(m.forfeit && m.forfeit !== 'none'){
      if(m.forfeit === 'B'){ A.wins++; B.losses++; }
      else if(m.forfeit === 'A'){ B.wins++; A.losses++; }
      return;
    }

    const mapsA = (m.maps||[]).filter(x => x && (x.scoreA||0) > (x.scoreB||0)).length;
    const mapsB = (m.maps||[]).filter(x => x && (x.scoreB||0) > (x.scoreA||0)).length;
    A.mapsW += mapsA; A.mapsL += mapsB;
    B.mapsW += mapsB; B.mapsL += mapsA;
    (m.maps||[]).forEach(x => {
      if(!x) return;
      A.roundsFor += Number(x.scoreA||0); A.roundsAgainst += Number(x.scoreB||0);
      B.roundsFor += Number(x.scoreB||0); B.roundsAgainst += Number(x.scoreA||0);
    });
    if(mapsA > mapsB){ A.wins++; B.losses++; }
    else if(mapsB > mapsA){ B.wins++; A.losses++; }
  });
  const arr = Object.values(stats);
  arr.forEach(s => {
    s.mapDiff = s.mapsW - s.mapsL;
    s.roundDiff = s.roundsFor - s.roundsAgainst;
    s.pts = s.wins * 3;
  });
  arr.sort((a,b) =>
    b.wins - a.wins ||
    b.mapDiff - a.mapDiff ||
    b.roundDiff - a.roundDiff ||
    (a.name||'').localeCompare(b.name||'')
  );
  const tbody = document.getElementById('standings-body');
  if(!arr.length){ tbody.innerHTML='<tr><td colspan="6" class="empty" style="padding:40px">Aucune équipe</td></tr>'; return; }
  tbody.innerHTML = arr.map((r, i) => {
    const topCls = i===0?'top1':i===1?'top2':i===2?'top3':(i===arr.length-1?'last':'');
    const rankCls = i===0?'g1':i===1?'g2':i===2?'g3':'';
    const promoTag = i===0 ? '<span class="promo-tag promo-up">↑ MONTE</span>' : (i===arr.length-1 ? '<span class="promo-tag promo-down">↓ DESCEND</span>' : '');
    const rd = r.roundDiff;
    const rdCls = rd>0?'pos':rd<0?'neg':'';
    const rdStr = (rd>0?'+':'')+rd;
    const logoHtml = r.logo
      ? `<div class="team-logo" style="background-image:url('${escapeAttr(r.logo)}')"></div>`
      : `<div class="team-logo placeholder">${escapeHtml(initials(r.name))}</div>`;
    return `
      <tr class="${topCls}">
        <td class="rank ${rankCls}">${i+1}</td>
        <td class="team"><div class="team-cell">${logoHtml}<span>${escapeHtml(r.name)}${promoTag}</span></div></td>
        <td><span class="w">${r.wins}</span> <span style="color:var(--muted2)">–</span> <span class="l">${r.losses}</span></td>
        <td class="maps">${r.mapsW}-${r.mapsL}</td>
        <td class="diff ${rdCls}">${rdStr}</td>
        <td class="pts">${r.pts}</td>
      </tr>`;
  }).join('');
}

/* ── MATCHES ── */
function renderMatches(matches, teamsById){
  const list = document.getElementById('matches-list');
  if(!matches.length){ list.innerHTML = '<div class="empty">Aucun match</div>'; return; }
  const enriched = matches.map(m => {
    const maps = Array.isArray(m.maps) ? m.maps : [];
    const anyFilled = maps.some(mp => mp && ((mp.scoreA||0) || (mp.scoreB||0)));
    const live = (m.status==='live') || (anyFilled && !m.played);
    return { ...m, _live: live };
  });
  const live = enriched.filter(m => m._live && !m.played);
  const pending = enriched.filter(m => !m.played && !m._live).sort((a,b)=> (a.time||'').localeCompare(b.time||''));
  const played = enriched.filter(m => m.played).reverse();
  const ordered = [...live, ...pending, ...played];

  list.innerHTML = ordered.map(m => {
    const tA = teamsById[m.teamA] || {name:'?',logo:''};
    const tB = teamsById[m.teamB] || {name:'?',logo:''};
    const isForfeit = m.forfeit && m.forfeit !== 'none';
    const mapsA = (m.maps||[]).filter(x => x && (x.scoreA||0) > (x.scoreB||0)).length;
    const mapsB = (m.maps||[]).filter(x => x && (x.scoreB||0) > (x.scoreA||0)).length;
    // Forfeit: A wins if m.forfeit==='B', B wins if m.forfeit==='A'
    const winA = isForfeit ? (m.forfeit === 'B') : (m.played && mapsA > mapsB);
    const winB = isForfeit ? (m.forfeit === 'A') : (m.played && mapsB > mapsA);
    let statusCls, statusTxt, cardCls;
    if(isForfeit){ statusCls='done'; statusTxt='FORFAIT'; cardCls='played forfeit'; }
    else if(m._live){ statusCls='live'; statusTxt='EN COURS'; cardCls='live'; }
    else if(m.played){ statusCls='done'; statusTxt='Terminé'; cardCls='played'; }
    else { statusCls='pend'; statusTxt=(m.time||'À venir'); cardCls=''; }
    let scoreA, scoreB;
    if(isForfeit){
      scoreA = winA ? 'W' : 'F';
      scoreB = winB ? 'W' : 'F';
    } else if(m.played || m._live){
      scoreA = mapsA; scoreB = mapsB;
    } else {
      scoreA = '-'; scoreB = '-';
    }
    const logoA = tA.logo ? `<div class="mlogo" style="background-image:url('${escapeAttr(tA.logo)}')"></div>` : `<div class="mlogo placeholder">${escapeHtml(initials(tA.name))}</div>`;
    const logoB = tB.logo ? `<div class="mlogo" style="background-image:url('${escapeAttr(tB.logo)}')"></div>` : `<div class="mlogo placeholder">${escapeHtml(initials(tB.name))}</div>`;

    // Maps rendering (hidden for forfeit)
    const maps = Array.isArray(m.maps) && m.maps.length ? m.maps : [];
    const mapsHtml = !isForfeit && maps.length ? `
      <div class="match-maps">
        ${[0,1,2].map(i=>{
          const mp = maps[i] || {scoreA:0,scoreB:0};
          const sA = mp.scoreA||0, sB = mp.scoreB||0;
          const anyFilled = sA || sB;
          if(!anyFilled) return `<div class="map-row empty"><span class="ml">MAP ${i+1}</span><span class="mp-line">—</span></div>`;
          const cls = sA>sB ? 'winA' : (sB>sA ? 'winB' : '');
          return `
            <div class="map-row ${cls}">
              <span class="ml">MAP ${i+1}</span>
              <span class="mp-line"><span class="mp a">${sA}</span><span class="mp-sep">–</span><span class="mp b">${sB}</span></span>
            </div>`;
        }).join('')}
      </div>` : (isForfeit ? `<div style="text-align:center;padding:10px;color:var(--warn);font-size:12px;letter-spacing:2px;text-transform:uppercase;font-weight:700">⚠ Victoire par forfait</div>` : '');
    const dateTxt = m.time ? 'BO3 · '+escapeHtml(m.time) : 'BO3';
    return `
      <div class="match-card ${cardCls}">
        <div class="match-card-head">
          <div class="match-date">${dateTxt}</div>
          <div class="match-status ${statusCls}">${statusTxt}</div>
        </div>
        <div class="match-teams">
          <div class="match-team left ${winA?'winner':''}">
            ${logoA}
            <div class="tname">${escapeHtml(tA.name)}</div>
            <div class="tscore">${scoreA}</div>
          </div>
          <div class="match-vs">VS</div>
          <div class="match-team right ${winB?'winner':''}">
            ${logoB}
            <div class="tname">${escapeHtml(tB.name)}</div>
            <div class="tscore">${scoreB}</div>
          </div>
        </div>
        ${mapsHtml}
      </div>`;
  }).join('');
}

/* ── MVP VIEW ── */
function renderMVPView(season){
  const topWrap = document.getElementById('mvp-top3-wrap');
  const pubWrap = document.getElementById('mvp-public-wrap');
  const qrWrap = document.getElementById('mvp-qr-wrap');
  if(!season){
    topWrap.innerHTML = '<div class="empty">Aucun MVP défini</div>';
    pubWrap.innerHTML = '';
    qrWrap.innerHTML = '';
    return;
  }
  const mvp = Array.isArray(season.mvp) ? season.mvp : [];
  const pub = season.publicPlayer;
  const vote = season.vote || {};

  // Top 3
  if(!mvp.length){
    topWrap.innerHTML = '<div class="empty">MVP à venir — en attente de stats</div>';
  } else {
    const cls = ['p2','p1','p3']; // visually: 2nd, 1st (center, higher), 3rd
    const order = [mvp[1], mvp[0], mvp[2]];
    const labels = ['2E','1ER','3E'];
    topWrap.innerHTML = `
      <div class="mvp-top">
        ${order.map((p, i) => {
          if(!p) return `<div class="mvp-card ${cls[i]}"><div class="mvp-pos">${labels[i]}</div><div class="mvp-pseudo" style="color:var(--muted)">—</div></div>`;
          return `
            <div class="mvp-card ${cls[i]}">
              <div class="mvp-pos">${labels[i]} MVP</div>
              <div class="mvp-pseudo">${escapeHtml(p.pseudo||'—')}</div>
              <div class="mvp-team">${escapeHtml(p.team||'')}</div>
              <div class="mvp-kda">
                <span class="k">${p.k||0}</span><span class="sep">/</span>
                <span class="d">${p.d||0}</span><span class="sep">/</span>
                <span class="a">${p.a||0}</span>
              </div>
              <div class="mvp-score">SCORE <b>${p.score||0}</b></div>
            </div>`;
        }).join('')}
      </div>`;
  }

  // Public player
  if(pub && pub.pseudo){
    pubWrap.innerHTML = `
      <div class="mvp-public">
        <div class="pub-meta">
          <div class="pub-label">⭐ Joueur du public</div>
          <div class="pub-name">${escapeHtml(pub.pseudo)}</div>
          <div class="pub-team">${escapeHtml(pub.team||'')}</div>
        </div>
        <div>
          <div class="pub-votes">${pub.votes||0}</div>
          <div class="pub-votes-label">votes</div>
        </div>
      </div>`;
  } else {
    pubWrap.innerHTML = '';
  }

  // QR code for public vote (only when open)
  const voteUrl = new URL('vote.html', location.href).href;
  const voteCode = (vote.code || '').toUpperCase();
  if(vote.open){
    const qr = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&bgcolor=ffffff&data='+encodeURIComponent(voteUrl);
    qrWrap.innerHTML = `
      <div class="mvp-qr">
        <img src="${qr}" alt="QR vote">
        <div class="mvp-qr-text">
          <div class="title">Vote Joueur du Public</div>
          <div class="sub open">● Scanne pour voter</div>
          ${voteCode ? `
            <div style="margin-top:10px;padding:10px 14px;background:var(--bg);border:2px solid var(--accent);display:inline-block">
              <div style="font-size:10px;color:var(--muted);letter-spacing:3px;text-transform:uppercase;font-weight:800">Code du soir</div>
              <div style="font-size:28px;font-weight:900;color:var(--accent);letter-spacing:5px;font-family:monospace;margin-top:2px">${escapeHtml(voteCode)}</div>
            </div>` : `<div class="sub" style="color:var(--danger);margin-top:6px">⚠ Code non défini</div>`}
        </div>
      </div>`;
  } else if(pub && pub.pseudo){
    // if vote is closed but we have a winner, hide QR
    qrWrap.innerHTML = '';
  } else {
    qrWrap.innerHTML = `
      <div class="mvp-qr">
        <div class="mvp-qr-text" style="text-align:center;width:100%">
          <div class="title">Vote Joueur du Public</div>
          <div class="sub closed">● Vote fermé — en attente d'ouverture</div>
        </div>
      </div>`;
  }
}

/* ── ROTATION matches ↔ MVP ── */
let rotIdx = 0;
const ROT_INTERVAL = 15000; // 15s par vue
function rotateRight(){
  rotIdx = (rotIdx + 1) % 2;
  applyRot();
}
function applyRot(){
  const views = ['view-matches', 'view-mvp'];
  const titles = ['// Matchs BO3', '// MVP de la soirée'];
  views.forEach((id, i) => document.getElementById(id).classList.toggle('on', i===rotIdx));
  document.getElementById('right-title').innerHTML = '<span>//</span> ' + titles[rotIdx].replace('// ','');
  for(let i=0;i<2;i++){
    const d = document.getElementById('dot-'+i);
    if(d) d.classList.toggle('on', i===rotIdx);
  }
}
setInterval(rotateRight, ROT_INTERVAL);

/* ── EVA VERSUS ── */
function renderVersus(v){
  const bar = document.getElementById('versus-bar');
  const wrap = document.getElementById('wrap');
  if(!v || !v.active){
    bar.style.display = 'none';
    wrap.classList.remove('has-versus');
    return;
  }
  bar.style.display = 'flex';
  wrap.classList.add('has-versus');
  document.getElementById('vs-team').textContent = (v.teamName||'—').toUpperCase();
  document.getElementById('vs-city').textContent = (v.city||'—').toUpperCase();
  document.getElementById('vs-date').textContent = v.date ? v.date.toUpperCase() : 'DATE À CONFIRMER';
  const gameEl = document.getElementById('vs-game');
  if(v.game){ gameEl.style.display = 'block'; gameEl.textContent = v.game.toUpperCase(); }
  else { gameEl.style.display = 'none'; }
  const logoEl = document.getElementById('vs-logo');
  if(v.logo){ logoEl.style.backgroundImage = `url('${v.logo}')`; }
  else { logoEl.style.backgroundImage = ''; }
}

/* ── UTILS ── */
function escapeHtml(s){
  if(s==null) return '';
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s){ return String(s==null?'':s).replace(/"/g,'&quot;').replace(/'/g,"\\'"); }
</script>
