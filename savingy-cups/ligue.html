function renderLiveStandings(monthData, dk){
  const el = document.getElementById('live-standings');
  if(!el) return;
  const teamIds = monthData.divisions?.[dk]?.teams || [];
  const teams = curTeams();
  if(!teamIds.length){
    el.innerHTML = `<div class="empty-state"><div class="ic">⌀</div><div class="lb">Division vacante</div></div>`;
    _prevLiveRanks = {};
    return;
  }

  // Si aucun match joué (soirée pas commencée OU reset complet) → on reset les prev ranks
  // pour ne pas afficher de flash montée/descente non pertinent
  const matchesObj = monthData.divisions?.[dk]?.matches || {};
  const anyDone = Object.values(matchesObj).some(mm=>mm.status==='done' || mm.finishedAt);
  if(!anyDone){
    _prevLiveRanks = {};
  }

  const standings = computeStandings(monthData, dk);
  const newRanks = {};
  standings.forEach((s,i)=>{ newRanks[s.tid] = i+1; });

  // ── FLIP animation : First (mesurer positions actuelles)
  const oldPositions = {};
  el.querySelectorAll('.live-row[data-tid]').forEach(row=>{
    const tid = row.dataset.tid;
    oldPositions[tid] = row.getBoundingClientRect().top;
  });

  // ── Re-render le HTML
  el.innerHTML = standings.map((s, idx)=>{
    const t = teams[s.tid] || {};
    const rank = idx+1;
    const rkCls = rank===1?'r1':rank===2?'r2':rank===3?'r3':rank===4?'r4':'';
    const mdCls = s.mapDiff > 0 ? 'pos' : s.mapDiff < 0 ? 'neg' : 'zero';
    const pdCls = s.pctDiff > 0 ? 'pos' : s.pctDiff < 0 ? 'neg' : 'zero';
    let flashCls = '';
    const prev = _prevLiveRanks[s.tid];
    if(prev && prev !== rank){ flashCls = prev > rank ? 'flash-up' : 'flash-down'; }
    const players = (t.players || []).map(llPlayerName).filter(Boolean).slice(0,7);
    const rosterHtml = players.length
      ? `<div class="nm-roster">${players.map(p=>`<span>${p}</span>`).join('')}</div>`
      : '';
    return `
      <div class="live-row ${rkCls} ${flashCls}" data-tid="${s.tid}">
        <div class="rk">${String(rank).padStart(2,'0')}</div>
        <div class="lg">${t.logo ? `<img src="${t.logo}" alt="">` : `<span class="lg-empty">${(t.tag||t.name||'?').substring(0,3).toUpperCase()}</span>`}</div>
        <div class="team-block">
          <div class="nm-name">${t.name || s.tid}${t.tag?` <span class="nm-tag" style="margin-left:10px">${t.tag}</span>`:''}</div>
          ${rosterHtml}
        </div>
        <div class="pts">${s.pts}</div>
        <div class="vd">${s.w}—${s.l}</div>
        <div class="md ${mdCls}">${s.mapDiff>0?'+':''}${s.mapDiff}</div>
        <div class="pd ${pdCls}">${s.pctDiff>0?'+':''}${s.pctDiff}%</div>
      </div>
    `;
  }).join('');

  // ── Last + Invert : pour chaque ligne, calculer la diff de position et appliquer un transform inverse instantané
  const newRows = el.querySelectorAll('.live-row[data-tid]');
  newRows.forEach(row=>{
    const tid = row.dataset.tid;
    const oldTop = oldPositions[tid];
    if(oldTop === undefined) return; // nouvelle équipe (pas d'ancien pos), pas d'animation
    const newTop = row.getBoundingClientRect().top;
    const dy = oldTop - newTop;
    if(Math.abs(dy) < 1) return; // pas bougé
    // Désactive transition pour appliquer l'inverse instant
    row.style.transition = 'none';
    row.style.transform = `translateY(${dy}px)`;
  });

  // ── Play : un frame plus tard, on retire le transform → transition CSS prend le relais
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      newRows.forEach(row=>{
        row.style.transition = '';   // restaure transition CSS naturelle (.65s)
        row.style.transform = '';    // retour à 0 → animation
      });
    });
  });

  _prevLiveRanks = newRanks;
}

function getLiveSlides(monthData, dk){
  const slides = [];
  // Slide 1 : Matchs du soir
  slides.push({ type:'matches', title:'MATCHS DU SOIR' });
  // Slide 2 : Top KDA soirée (top 3 podium + suivants en liste)
  const matches = monthData.divisions?.[dk]?.matches || {};
  const top = computeTopKDAFromMatchesArrays([matches]).slice(0, 12);
  slides.push({ type:'topkda-live', title:'TOP MVP SOIRÉE', data: top });
  return slides;
}

let _liveLastFp = '';
function _liveSlidesFingerprint(slides, monthData, dk){
  const matchesObj = monthData.divisions?.[dk]?.matches || {};
  const matchCount = Object.keys(matchesObj).length;
  const doneCount = Object.values(matchesObj).filter(mm=>mm.status==='done'||mm.finishedAt).length;
  // Somme des scores + somme des updatedAt → tout changement sur un match force un re-render
  let scoreSum = 0, lastTouched = 0;
  Object.values(matchesObj).forEach(mm=>{
    scoreSum += (mm.scoreA||0)*100 + (mm.scoreB||0);
    lastTouched = Math.max(lastTouched, mm.finishedAt||0);
  });
  const kdaLen = (slides.find(s=>s.type==='topkda-live')?.data || []).length;
  const firstKda = (slides.find(s=>s.type==='topkda-live')?.data?.[0]?.player) || '';
  return `${dk}|${matchCount}|${doneCount}|${scoreSum}|${lastTouched}|${kdaLen}|${firstKda}`;
}

function renderLiveCarousel(monthData, dk){
  const body = document.getElementById('rc-live-body');
  const dots = document.getElementById('rc-live-dots');
  const titleEl = document.getElementById('rc-live-title');
  if(!body || !dots) return;
  const carouselEl = body.closest('.right-carousel');
  const slides = getLiveSlides(monthData, dk);

  // Détection d'état vide
  const matchesObj = monthData.divisions?.[dk]?.matches || {};
  const hasMatches = Object.values(matchesObj).some(mm=>!mm.forfeit);
  const hasKDA = (slides.find(s=>s.type==='topkda-live')?.data || []).length > 0;
  if(!hasMatches && !hasKDA){
    if(carouselEl) carouselEl.classList.add('empty');
  } else {
    if(carouselEl) carouselEl.classList.remove('empty');
  }

  if(_liveCarouselIdx >= slides.length) _liveCarouselIdx = 0;
  const cur = slides[_liveCarouselIdx];
  titleEl.textContent = cur.title;

  const fp = _liveSlidesFingerprint(slides, monthData, dk);
  const slideEls = body.querySelectorAll('.rc-slide');

  if(fp !== _liveLastFp || slideEls.length !== slides.length){
    body.innerHTML = slides.map((s, idx)=>{
      const onCls = idx === _liveCarouselIdx ? 'on' : '';
      return `<div class="rc-slide ${onCls}" data-idx="${idx}">${renderLiveSlideContent(s, monthData, dk)}</div>`;
    }).join('');
    _liveLastFp = fp;
  } else {
    slideEls.forEach((el, idx)=>{
      const wasOn = el.classList.contains('on');
      const isOn  = idx === _liveCarouselIdx;
      el.classList.remove('exiting');
      if(wasOn && !isOn){
        el.classList.remove('on');
        el.classList.add('exiting');
        setTimeout(()=>el.classList.remove('exiting'), 950);
      } else if(!wasOn && isOn){
        el.classList.add('on');
      }
    });
  }

  dots.innerHTML = slides.map((_,i)=>`<div class="rc-h-dot ${i===_liveCarouselIdx?'on':''}"></div>`).join('');

  // Auto-resize uniquement pour les noms d'équipe dans les matchs (peuvent être longs)
  _fitAllNames(body, '.match-line-team-name', 24);
}

function renderLiveSlideContent(slide, monthData, dk){
  if(slide.type === 'matches'){
    const matches = Object.entries(monthData.divisions?.[dk]?.matches || {})
      .map(([id,m])=>({id,...m}))
      .filter(mm=>!mm.forfeit)
      .sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));

    const teams = curTeams();
    return `<div class="rc-matches-list">
      ${matches.map(mm=>{
        const tA = teams[mm.tA] || {}, tB = teams[mm.tB] || {};
        const isDone = mm.status==='done' || mm.finishedAt;
        const winA = isDone && (mm.scoreA||0) > (mm.scoreB||0);
        const winB = isDone && (mm.scoreB||0) > (mm.scoreA||0);
        return `
          <div class="match-line ${isDone?'done':''}">
            <div class="match-line-time-block">
              <div class="match-line-time">${mm.time || '—'}</div>

              <span class="match-line-team-name">${tA.tag || tA.name || '?'}</span>
            </div>
            <div class="match-line-score ${isDone?'':'pending'}">${isDone ? `${mm.scoreA||0}—${mm.scoreB||0}` : 'VS'}</div>
            <div class="match-line-team r ${winB?'win':''}">
              <span class="match-line-team-name">${tB.tag || tB.name || '?'}</span>
              ${tB.logo ? `<img src="${tB.logo}">` : ''}
            </div>
          </div>
        `;
      }).join('')}
    </div>`;
  }
  if(slide.type === 'topkda-live'){
    if(!slide.data.length){
      return `<div class="empty-state"><div class="ic">○</div><div class="lb">EN ATTENTE</div><div class="sb">Stats KDA en cours de saisie</div></div>`;
    }
    const teams = curTeams();
    const top3 = slide.data.slice(0, 3);
    const rest = slide.data.slice(3); // 4ème et suivants

    const top3Html = top3.map((p, i)=>{
      const t = teams[p.teamId] || {};
      const rank = i+1;
      const fallback = (t.tag || t.name || '?').substring(0,3).toUpperCase();
      const playerPhoto = findPlayerPhoto(t, p.player);
      const styleAttr = t.logo
        ? `style="--logo-url:url('${t.logo}')"`
        : '';
      const fallbackHtml = (t.logo || playerPhoto)
        ? ''
        : `<div class="rc-mvp-spot-fallback">${fallback}</div>`;
      const photoHtml = playerPhoto
        ? `<div class="rc-mvp-spot-photo" style="background-image:url('${playerPhoto}')"></div>`
        : '';
      const cls = `rc-mvp-spot r${rank}${playerPhoto?' has-photo':''}`;
      const mapsCount = p.maps || 0;
      return `
        <div class="${cls}" ${styleAttr}>
          ${fallbackHtml}
          ${photoHtml}
          <div class="rc-mvp-spot-info">
            <div class="rc-mvp-spot-name">${p.player}</div>
            <div class="rc-mvp-spot-team">${t.tag || t.name || ''}</div>
            <div class="rc-mvp-spot-stats">
              <div class="rc-mvp-spot-ratio">${p.ratio.toFixed(2)}</div>
              <div class="rc-mvp-spot-stats-right">
                <div class="rc-mvp-spot-kda">${p.k}/${p.d}/${p.a}</div>
                <div class="rc-mvp-spot-maps">${mapsCount} MAP${mapsCount>1?'S':''}</div>
              </div>
            </div>
          </div>
        </div>

    }).join('');

    const restHtml = rest.length ? `
      <div class="rc-mvp-rest">
        <div class="rc-mvp-rest-head">SUIVANTS</div>
        <div class="rc-mvp-rest-list">
          ${rest.map((p, i)=>{
            const t = teams[p.teamId] || {};
            const rank = i + 4;
            return `
              <div class="rc-mvp-rest-row">
                <div class="rc-mvp-rest-rk">${rank}</div>
                <div class="rc-mvp-rest-info">
                  <div class="rc-mvp-rest-name">${p.player}</div>
                  <div class="rc-mvp-rest-team">${t.tag || t.name || ''} · ${p.k}/${p.d}/${p.a}</div>
                </div>
                <div class="rc-mvp-rest-ratio">${p.ratio.toFixed(2)}</div>
              </div>
            `;
          }).join('')}
        </div>
      </div>
    ` : '';

    return `
      <div class="rc-mvp-period">TOP MVP SOIRÉE<span>CUMUL KDA</span></div>
      <div class="rc-mvp-mini">
        <div class="rc-mvp-top3">${top3Html}</div>
        ${restHtml}
      </div>
    `;
  }
  return '';
}

function startLiveCarousel(){
  if(_liveCarouselTimer) clearInterval(_liveCarouselTimer);
  _liveCarouselTimer = setInterval(()=>{
    if(_currentMode !== 'live') return;
    const live = detectLiveEvening();
    if(!live) return;
    const md = curSplit()?.months?.[live.ym];
    if(!md) return;
    const slides = getLiveSlides(md, live.dk);
    if(!slides.length) return;
    _liveCarouselIdx = (_liveCarouselIdx + 1) % slides.length;
    renderLiveCarousel(md, live.dk);
  }, 13000);
}

/* ════════════════════════════════════════════════════════════════════
   MODE CÉRÉMONIE PODIUM
   ════════════════════════════════════════════════════════════════════ */
let _ceremonyTimers = [];
let _ceremonyFingerprint = '';

function clearCeremonyTimers(){
  _ceremonyTimers.forEach(t=>clearTimeout(t));
  _ceremonyTimers = [];
  // retire confettis
  document.querySelectorAll('.confetti').forEach(c=>c.remove());
}

function fmtCeremonyFingerprint(c){
  // Pour ne pas relancer l'animation si Firebase change d'autres champs
  return `${c?.ym||''}|${c?.dk||''}|${c?.startedAt||''}|${c?.phase||''}`;
}

let _lastCeremonyKey = ''; // ym|dk uniquement (pour détecter changement de phase sur même soirée)

function renderCeremony(){
  const c = llState.ceremony;
  if(!c) return;
  const fp = fmtCeremonyFingerprint(c);
  const isNewCeremony = (fp !== _ceremonyFingerprint);
  if(!isNewCeremony) return;

  const prevFp = _ceremonyFingerprint;
  _ceremonyFingerprint = fp;

  // Détecter si c'est juste un changement de phase sur la même cérémonie
  const sameKey = `${c.ym}|${c.dk}`;
  const isPhaseTransition = (
    prevFp &&
    prevFp.startsWith(sameKey + '|') &&  // même soirée
    !fp.startsWith(prevFp.split('|').slice(0,3).join('|'))  // mais startedAt ou phase a changé
  );

  if(isPhaseTransition && _lastCeremonyKey === sameKey){
    // Transition douce : fade-out des slots actuels, puis lance la nouvelle phase
    clearCeremonyTimers();
    transitionToNewPhase(c);
  } else {
    // Nouvelle cérémonie depuis zéro
    clearCeremonyTimers();
    runCeremonyAnimation(c);
  }
  _lastCeremonyKey = sameKey;
}

function transitionToNewPhase(c){
  // Fade-out propre des slots existants
  const wrap = document.getElementById('podium-wrap');
  const slots = wrap.querySelectorAll('.podium-slot');
  slots.forEach((el, idx)=>{
    el.style.transition = 'opacity .6s ease, transform .6s ease';
    el.style.opacity = '0';
    el.style.transform = 'translateY(40px) scale(.92)';
  });
  // Fade-out header + nettoyage confettis
  const headerEl = document.getElementById('ceremony-header');
  if(headerEl) headerEl.classList.remove('in');
  document.querySelectorAll('.confetti').forEach(x=>x.remove());

  // Après le fade-out, on lance la nouvelle phase
  _ceremonyTimers.push(setTimeout(()=>{
    runCeremonyAnimation(c);
  }, 700));
}

function runCeremonyAnimation(c){
  // Reset visuel commun
  const headerEl = document.getElementById('ceremony-header');
  const introEl = document.getElementById('ceremony-intro');
  const wrap = document.getElementById('podium-wrap');
  if(headerEl) headerEl.classList.remove('in');
  if(introEl) introEl.classList.remove('in');
  wrap.innerHTML = '';

  // Dispatch selon la phase
  const phase = c.phase || 'standings';
  if(phase === 'mvp'){
    return runMvpAnimation(c);
  }
  return runStandingsAnimation(c);
}

function runStandingsAnimation(c){
  const split = curSplit();
  if(!split) return;
  const monthData = split.months?.[c.ym];
  if(!monthData) return;

  const standings = computeStandings(monthData, c.dk);
  if(!standings.length){ console.warn('No standings for ceremony'); return; }
  const teams = curTeams();

  const headerEl = document.getElementById('ceremony-header');
  document.getElementById('ceremony-h-title').textContent = `${c.dk.toUpperCase()} · ${fmtMonth(c.ym)}`;
  document.getElementById('ceremony-h-sub').textContent = 'Classement final de la soirée';

  const introEl = document.getElementById('ceremony-intro');
  const introIcon = introEl?.querySelector('.ceremony-intro-icon');
  if(introIcon) introIcon.textContent = '🏆';
  document.getElementById('ceremony-intro-text').textContent = 'PODIUM';
  document.getElementById('ceremony-intro-sub').textContent = `${c.dk.toUpperCase()} · ${fmtMonth(c.ym)}`;

  const wrap = document.getElementById('podium-wrap');

  // Phase 1 : Header
  _ceremonyTimers.push(setTimeout(()=>{
    if(headerEl) headerEl.classList.add('in');
  }, 200));
  // Phase 2 : Intro trophée
  _ceremonyTimers.push(setTimeout(()=>{
    if(introEl) introEl.classList.add('in');
  }, 600));
  // Phase 3 : on cache l'intro
  _ceremonyTimers.push(setTimeout(()=>{
    if(introEl) introEl.classList.remove('in');
  }, 3500));

  // Phase 4 : on construit les 4 slots du podium (vides, off-screen)
  _ceremonyTimers.push(setTimeout(()=>{
    // Pour chaque équipe, on calcule son mouvement (montée / descente / champion / reste)
    // Règles :
    //  - 1er → monte (D2→D1, D3→D2, D4→D3) SAUF D1 où il reste champion
    //  - Dernier (= dernier rang réel, peut être 4ème ou moins si div pas pleine)
    //    → descend (D1→D2, D2→D3, D3→D4) SAUF D4 où il reste
    const lastRank = standings.length; // 1-indexé, donc le dernier rang
    const dk = c.dk;
    const dkUp = {d2:'d1', d3:'d2', d4:'d3'}[dk] || null;
    const dkDown = {d1:'d2', d2:'d3', d3:'d4'}[dk] || null;

    function moveBadgeFor(rank){
      // 1er
      if(rank === 1){
        if(dk === 'd1'){
          return { cls:'champion', arrow:'★', text:`Champion` };
        }
        return { cls:'up', arrow:'▲', text:`Monte en ${dkUp.toUpperCase()}` };
      }
      // dernier (uniquement si la division a au moins 2 équipes ET ce n'est pas aussi le 1er)
      if(rank === lastRank && lastRank >= 2){
        if(dk === 'd4'){
          return { cls:'stay', arrow:'═', text:`Reste en D4` };
        }
        return { cls:'down', arrow:'▼', text:`Descend en ${dkDown.toUpperCase()}` };
      }
      return null;
    }

    for(let i=0; i<Math.min(4, standings.length); i++){
      const s = standings[i];
      const t = teams[s.tid] || {};
      const rank = i+1;
      const medals = {1:'🥇', 2:'🥈', 3:'🥉', 4:'🏅'};
      const move = moveBadgeFor(rank);
      const moveHtml = move
        ? `<div class="podium-move ${move.cls}"><span class="podium-move-arrow">${move.arrow}</span>${move.text}</div>`
        : '';
      const slotHtml = `
        <div class="podium-slot r${rank}" data-rank="${rank}">
          <div class="podium-card">
            <div class="podium-medal">${medals[rank]||''}</div>
            <div class="podium-logo">
              ${t.logo
                ? `<img src="${t.logo}" alt="">`
                : `<span class="podium-logo-empty">${(t.tag||t.name||'?').substring(0,3).toUpperCase()}</span>`}
            </div>
            <div class="podium-text">
              <div class="podium-name">${t.name || s.tid}</div>
              <div class="podium-tag">${t.tag || ''}</div>
            </div>
            <div class="podium-stats">
              <div class="pts">PTS<strong>${s.pts}</strong></div>
              <div>V—D<strong>${s.w}—${s.l}</strong></div>
              <div>±MAP<strong>${s.mapDiff>0?'+':''}${s.mapDiff}</strong></div>
            </div>
            ${moveHtml}
          </div>
          <div class="podium-base">${rank}</div>
        </div>
      `;
      wrap.insertAdjacentHTML('beforeend', slotHtml);
    }

    // Animer l'arrivée : 4ème → 3ème → 2ème → 1er
    const reveal = (rank, delay)=>{
      _ceremonyTimers.push(setTimeout(()=>{
        const el = wrap.querySelector(`.podium-slot.r${rank}`);
        if(el) el.classList.add('in');
        // Confettis sur le 1er
        if(rank === 1) launchConfetti();
      }, delay));
    };
    if(standings.length >= 4) reveal(4, 200);
    reveal(3, 1100);
    if(standings.length >= 2) reveal(2, 2000);
    reveal(1, 2900);

    // Phase 5 : Révéler les badges de mouvement (montée/descente/champion)
    // Timing : après l'arrivée du 1er (2900ms) + 1500ms = 4400ms après le début de cette phase 4
    // On les révèle dans l'ordre : descente d'abord (dernier), puis montée (1er) — narratif progressif
    _ceremonyTimers.push(setTimeout(()=>{
      // Badge descente (sur le dernier rang affiché)
      const lastEl = wrap.querySelector(`.podium-slot.r${lastRank} .podium-move`);
      if(lastEl) lastEl.classList.add('in');
    }, 4200));
    _ceremonyTimers.push(setTimeout(()=>{
      // Badge montée (sur le 1er)
      const firstEl = wrap.querySelector(`.podium-slot.r1 .podium-move`);
      if(firstEl) firstEl.classList.add('in');
      // Petit shower de confettis sur le 1er au moment du badge "monte"/"champion"
      if(dk === 'd1') launchConfetti(); // re-shower pour le champion
    }, 5000));
  }, 3700));
}

/* ────────── PHASE MVP ────────── */
function runMvpAnimation(c){
  const split = curSplit();
  if(!split) return;
  const monthData = split.months?.[c.ym];
  if(!monthData) return;

  // Top KDA de la soirée (3 meilleurs)
  const matches = monthData.divisions?.[c.dk]?.matches || {};
  const topKDA = computeTopKDAFromMatchesArrays([matches]);
  const top3 = topKDA.slice(0, 3);
  const teams = curTeams();

  // Header
  const headerEl = document.getElementById('ceremony-header');
  document.getElementById('ceremony-h-title').textContent = `MVP · ${c.dk.toUpperCase()} · ${fmtMonth(c.ym)}`;
  document.getElementById('ceremony-h-sub').textContent = 'Top KDA de la soirée';

  // Intro avec icône MVP
  const introEl = document.getElementById('ceremony-intro');
  const introIcon = introEl?.querySelector('.ceremony-intro-icon');
  if(introIcon) introIcon.textContent = '🎖️';
  document.getElementById('ceremony-intro-text').textContent = 'MVP';
  document.getElementById('ceremony-intro-sub').textContent = `${c.dk.toUpperCase()} · ${fmtMonth(c.ym)}`;

  const wrap = document.getElementById('podium-wrap');

  // Phase 1 : Header
  _ceremonyTimers.push(setTimeout(()=>{
    if(headerEl) headerEl.classList.add('in');
  }, 200));
  // Phase 2 : Intro
  _ceremonyTimers.push(setTimeout(()=>{
    if(introEl) introEl.classList.add('in');
  }, 600));
  // Phase 3 : on cache l'intro
  _ceremonyTimers.push(setTimeout(()=>{
    if(introEl) introEl.classList.remove('in');
  }, 3500));

  // Phase 4 : on construit les slots MVP
  _ceremonyTimers.push(setTimeout(()=>{
    if(!top3.length){
      // Pas de KDA → message
      wrap.innerHTML = `<div style="text-align:center;color:var(--muted);font-size:24px;font-weight:700;letter-spacing:4px;text-transform:uppercase;padding:60px 20px">Aucune statistique KDA enregistrée pour cette soirée</div>`;
      return;
    }

    // 3 slots : on réutilise le système r1/r2/r3 (1er au centre, 2 à gauche, 3 à droite)
    const medals = {1:'🥇', 2:'🥈', 3:'🥉'};
    for(let i=0; i<top3.length; i++){
      const p = top3[i];
      const t = teams[p.teamId] || {};
      const rank = i+1;
      const fallback = (t.tag || t.name || '?').substring(0,3).toUpperCase();
      const playerPhoto = findPlayerPhoto(t, p.player);
      const styleAttr = t.logo
        ? `style="--logo-url:url('${t.logo}')"`
        : '';
      const fallbackHtml = (t.logo || playerPhoto)
        ? ''
        : `<div class="podium-card-fallback">${fallback}</div>`;
      const photoHtml = playerPhoto
        ? `<div class="podium-card-photo" style="background-image:url('${playerPhoto}')"></div>`
        : '';
      const cardCls = `podium-card mvp${playerPhoto?' has-photo':''}`;
      const slotHtml = `
        <div class="podium-slot r${rank}" data-rank="${rank}">
          <div class="${cardCls}" ${styleAttr}>
            ${fallbackHtml}
            ${photoHtml}
            <div class="podium-info">
              <div class="podium-text">
                <div class="podium-name">${p.player}</div>
                <div class="podium-tag">${t.tag || t.name || p.teamId}</div>
              </div>
              <div class="podium-stats">
                <div class="pts"><strong>${p.ratio.toFixed(2)}</strong></div>
                <div><strong>${p.k}/${p.d}/${p.a}</strong></div>
                <div><strong>${p.maps} MAP${p.maps>1?'S':''}</strong></div>
              </div>
            </div>
          </div>
          <div class="podium-base">${rank}</div>
        </div>
      `;
      wrap.insertAdjacentHTML('beforeend', slotHtml);
    }

    // Animer l'arrivée : 3ème → 2ème → 1er
    const reveal = (rank, delay)=>{
      _ceremonyTimers.push(setTimeout(()=>{
        const el = wrap.querySelector(`.podium-slot.r${rank}`);
        if(el) el.classList.add('in');
        if(rank === 1) launchConfetti();
      }, delay));
    };
    if(top3.length >= 3) reveal(3, 200);
    if(top3.length >= 2) reveal(2, 1100);
    reveal(1, 2000);

    // (Phase 4ème MVP — vote public — sera ajoutée quand vote.html sera prêt)
  }, 3700));
}

function launchConfetti(){
  const colors = ['#E05A3A', '#F5C842', '#FFFFFF', '#FF6E48', '#C8C8C8', '#CD7F32'];
  const wrap = document.getElementById('content-ceremony');
  if(!wrap) return;
  const N = 90;
  for(let i=0; i<N; i++){
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random()*100 + '%';
    c.style.background = colors[Math.floor(Math.random()*colors.length)];
    c.style.width = (6 + Math.random()*8) + 'px';
    c.style.height = (10 + Math.random()*10) + 'px';
    c.style.animationDuration = (2.4 + Math.random()*2.5) + 's';
    c.style.animationDelay = (Math.random()*1.4) + 's';
    c.style.transform = `rotate(${Math.random()*360}deg)`;
    wrap.appendChild(c);
    // Cleanup
    _ceremonyTimers.push(setTimeout(()=>c.remove(), 5500));
  }
}

/* ════════════════════════════════════════════════════════════════════
   SWITCH MODE
   ════════════════════════════════════════════════════════════════════ */
function switchMode(){
  const ceremony = llState.ceremony;
  const live = detectLiveEvening();
  const topbar = document.getElementById('topbar');
  const tag = document.getElementById('tb-mode-tag');
  const clock = document.getElementById('tb-clock');

  // Priorité 1 : cérémonie en cours (override tout)
  if(ceremony && ceremony.active){
    if(_currentMode !== 'ceremony'){
      _currentMode = 'ceremony';
      _ceremonyFingerprint = ''; // force reload de l'animation
    }
    document.getElementById('content-overview').style.display = 'none';
    document.getElementById('content-live').style.display = 'none';
    document.getElementById('content-ceremony').style.display = 'block';
    topbar.classList.remove('live');
    tag.textContent = `🏆 CÉRÉMONIE · ${ceremony.dk.toUpperCase()}`;
    tag.style.background = 'var(--accent)';
    tag.style.color = '#fff';
    clock.classList.remove('live');
    renderCeremony();
    return;
  }

  // Reset du fingerprint cérémonie quand on quitte le mode
  _ceremonyFingerprint = '';
  clearCeremonyTimers();
  tag.style.background = '';
  tag.style.color = '';

  if(live){
    if(_currentMode !== 'live'){ _currentMode = 'live'; _prevLiveRanks = {}; _liveCarouselIdx = 0; _liveLastFp=''; }
    document.getElementById('content-overview').style.display = 'none';
    document.getElementById('content-live').style.display = 'block';
    document.getElementById('content-ceremony').style.display = 'none';
    topbar.classList.add('live');
    tag.textContent = `LIVE · ${live.dk.toUpperCase()}`;
    clock.classList.add('live');
    renderLive(live.ym, live.dk);
  } else {
    if(_currentMode !== 'overview'){ _currentMode = 'overview'; _prevDivRanks={d1:{},d2:{},d3:{},d4:{}}; _ovCarouselIdx=0; _ovLastFp=''; }
    document.getElementById('content-overview').style.display = 'block';
    document.getElementById('content-live').style.display = 'none';
    document.getElementById('content-ceremony').style.display = 'none';
    topbar.classList.remove('live');
    tag.textContent = 'CLASSEMENT GÉNÉRAL';
    clock.classList.remove('live');
    renderOverview();
    renderOverviewCarousel();
  }
}

/* ════════════════════════════════════════════════════════════════════
   HORLOGE + SPLIT INFO
   ════════════════════════════════════════════════════════════════════ */
function tickClock(){
  const d = new Date();
  const h = String(d.getHours()).padStart(2,'0');
  const m = String(d.getMinutes()).padStart(2,'0');
  const c = document.getElementById('tb-clock');
  if(c) c.textContent = `${h}:${m}`;
  const dt = document.getElementById('tb-date');
  if(dt) dt.textContent = d.toLocaleDateString('fr-FR',{weekday:'long',day:'2-digit',month:'short'}).toUpperCase();
}
setInterval(tickClock, 1000);
tickClock();

function updateSplitInfo(){
  const split = curSplit();
  const el = document.getElementById('tb-split-name');
  if(!el) return;
  el.textContent = split ? (split.name || `${llState.current.year}/${llState.current.split}`) : 'AUCUN';
}

/* ════════════════════════════════════════════════════════════════════
   FIREBASE LISTENER
   ════════════════════════════════════════════════════════════════════ */
db.ref('ligue').on('value', snap=>{
  llState = snap.val() || { current:null, seasons:{}, slides:{}, liveOverride:null, ceremony:null };
  document.getElementById('loader').style.display = 'none';
  document.getElementById('topbar').style.display = 'flex';
  updateSplitInfo();
  switchMode();
});

setInterval(switchMode, 60000);
startOverviewCarousel();
startLiveCarousel();
</script>

<!-- Bouton fullscreen (utile pour TV sans F11) -->
<button class="fs-btn" id="fs-btn" title="Plein écran" aria-label="Activer le plein écran">
  <svg class="ic-expand" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
  <svg class="ic-reduce" viewBox="0 0 24 24"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
</button>

<script>
/* ════════════════════════════════════════════════════════════════════
   FULLSCREEN
   ════════════════════════════════════════════════════════════════════ */
(function(){
  const btn = document.getElementById('fs-btn');
  if(!btn) return;

  function isFullscreen(){
    return !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement);
  }
  function reqFullscreen(el){
    if(el.requestFullscreen) return el.requestFullscreen();
    if(el.webkitRequestFullscreen) return el.webkitRequestFullscreen();
    if(el.mozRequestFullScreen) return el.mozRequestFullScreen();
  }
  function exitFullscreen(){
    if(document.exitFullscreen) return document.exitFullscreen();
    if(document.webkitExitFullscreen) return document.webkitExitFullscreen();
    if(document.mozCancelFullScreen) return document.mozCancelFullScreen();
  }
  btn.addEventListener('click', ()=>{
    if(isFullscreen()){
      exitFullscreen();
    } else {
      reqFullscreen(document.documentElement).catch(err=>{
        console.warn('Fullscreen denied:', err);
      });
    }
  });
  function syncFsClass(){
    document.body.classList.toggle('is-fullscreen', isFullscreen());
  }
  document.addEventListener('fullscreenchange', syncFsClass);
  document.addEventListener('webkitfullscreenchange', syncFsClass);
  document.addEventListener('mozfullscreenchange', syncFsClass);

  // Auto-fade : après 3s d'inactivité souris, le bouton devient très discret
  let idleTimer = null;
  function bumpActivity(){
    btn.classList.remove('idle');
    if(idleTimer) clearTimeout(idleTimer);
    idleTimer = setTimeout(()=> btn.classList.add('idle'), 3000);
  }
  document.addEventListener('mousemove', bumpActivity, {passive:true});
  document.addEventListener('touchstart', bumpActivity, {passive:true});
  bumpActivity();
})();
</script>
