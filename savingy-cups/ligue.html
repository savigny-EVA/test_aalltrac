body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(circle at 8% 12%, rgba(224,90,58,.14) 0%, transparent 35%),
    radial-gradient(circle at 92% 88%, rgba(224,90,58,.09) 0%, transparent 35%);
}

/* ──────────── TOPBAR ──────────── */
.topbar{
  position:fixed;top:0;left:0;right:0;z-index:50;
  height:72px;background:linear-gradient(180deg, rgba(8,8,8,.94) 0%, rgba(8,8,8,.7) 100%);
  border-bottom:2px solid var(--accent);
  display:flex;align-items:center;justify-content:space-between;padding:0 28px;
  backdrop-filter:blur(8px);
}
.topbar.live{
  border-bottom-color:var(--live);
  background:linear-gradient(180deg, rgba(224,90,58,.07) 0%, rgba(8,8,8,.7) 100%);
}
.tb-left{display:flex;align-items:center;gap:22px}
.tb-logo-img{
  height:50px;width:auto;display:block;
  filter:drop-shadow(0 2px 14px rgba(224,90,58,.4));
}
.tb-text{display:flex;flex-direction:column;gap:2px;border-left:1px solid var(--border2);padding-left:18px}
.tb-text-l1{font-size:24px;font-weight:900;letter-spacing:5px;text-transform:uppercase;line-height:1}
.tb-text-l2{font-size:13px;font-weight:700;letter-spacing:6px;color:var(--accent);text-transform:uppercase;margin-top:4px}
.tb-mode-tag{
  font-size:13px;font-weight:900;letter-spacing:3px;text-transform:uppercase;
  padding:8px 16px;background:var(--accent-dim);color:var(--accent);
  border:1px solid rgba(224,90,58,.3);margin-left:14px;
  position:relative;
}
.topbar.live .tb-mode-tag{
  background:var(--accent);color:#fff;border-color:var(--accent);
  padding-left:30px;
  animation:pulseLive 2s ease-in-out infinite;
}
.topbar.live .tb-mode-tag::before{
  content:'';position:absolute;left:12px;top:50%;transform:translateY(-50%);
  width:8px;height:8px;background:#fff;border-radius:50%;
  animation:blinkWhite 1.4s ease-in-out infinite;
  box-shadow:0 0 8px rgba(255,255,255,.8);
}
@keyframes pulseLive{
  0%,100%{box-shadow:0 0 0 0 rgba(224,90,58,.5)}
  50%{box-shadow:0 0 0 14px rgba(224,90,58,0)}
}
@keyframes blinkWhite{0%,50%{opacity:1}51%,100%{opacity:.3}}

.tb-right{display:flex;align-items:center;gap:22px}
.tb-clock{font-size:28px;font-weight:900;letter-spacing:3px;color:var(--text);font-variant-numeric:tabular-nums;line-height:1}
.tb-clock.live{color:var(--live)}
.tb-date{font-size:12px;color:var(--muted);letter-spacing:3px;text-transform:uppercase;font-weight:700;text-align:right;margin-top:4px}
.tb-split-info{
  font-size:13px;color:var(--muted);letter-spacing:3px;text-transform:uppercase;font-weight:700;text-align:right;
  border-right:2px solid var(--border2);padding-right:22px;
}
.tb-split-info strong{color:var(--text);font-weight:900;display:block;font-size:17px;margin-top:4px;letter-spacing:2px}

/* ──────────── CONTENT ──────────── */
.content{position:absolute;top:72px;bottom:0;left:0;right:0;padding:18px 28px;overflow:hidden;z-index:1}

/* ════════════════════════════════════════════════════════════════════
   MODE OVERVIEW (HORS SOIRÉE)
   ════════════════════════════════════════════════════════════════════ */
.mode-overview{display:grid;grid-template-columns:65fr 35fr;gap:18px;height:100%}
.overview-grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:12px;min-height:0}

.div-card{
  background:linear-gradient(135deg, var(--bg2) 0%, var(--bg3) 100%);
  border:1px solid var(--border);position:relative;display:flex;flex-direction:column;
  overflow:hidden;min-height:0;
  transition:background .8s ease, border-color .8s ease, opacity .8s ease;
}
.div-card.empty{
  background:linear-gradient(135deg, rgba(14,14,14,.35) 0%, rgba(22,22,22,.35) 100%);
  border-color:rgba(255,255,255,.04);
  animation:fadeBreath 4s ease-in-out infinite;
}
.div-card.empty .div-card-header{
  background:rgba(0,0,0,.15);
  border-bottom-color:rgba(255,255,255,.04);
}
.div-card.empty::before{
  opacity:.3;
}
@keyframes fadeBreath{
  0%,100%{opacity:.85}
  50%{opacity:.55}
}
.div-card.d1{border-left:3px solid var(--gold)}
.div-card.d2{border-left:3px solid var(--silver)}
.div-card.d3{border-left:3px solid var(--bronze)}
.div-card.d4{border-left:3px solid var(--d4)}
.div-card.empty.d1{border-left-color:rgba(245,200,66,.4)}
.div-card.empty.d2{border-left-color:rgba(200,200,200,.4)}
.div-card.empty.d3{border-left-color:rgba(205,127,50,.4)}
.div-card.empty.d4{border-left-color:rgba(140,45,23,.5)}
.div-card::before{
  content:'';position:absolute;top:0;right:0;width:200px;height:200px;
  background:radial-gradient(circle at top right, rgba(224,90,58,.08) 0%, transparent 70%);
  pointer-events:none;
}

.div-card-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 16px;border-bottom:1px solid var(--border);background:rgba(0,0,0,.3);
}
.div-card-title{font-size:30px;font-weight:900;letter-spacing:5px;text-transform:uppercase;line-height:1}
.div-card.d1 .div-card-title{color:var(--gold)}
.div-card.d2 .div-card-title{color:var(--silver)}
.div-card.d3 .div-card-title{color:var(--bronze)}
.div-card.d4 .div-card-title{color:var(--d4)}
.div-card-meta{font-size:14px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;font-weight:700}
.div-card-meta span{color:var(--text);font-weight:900}

.div-rows{flex:1;padding:2px 10px;display:flex;flex-direction:column;justify-content:space-around;min-height:0}
.div-row{
  display:grid;grid-template-columns:36px 56px 1fr auto auto auto;
  gap:12px;align-items:center;padding:4px 4px;
  border-bottom:1px dashed var(--border);transition:transform .65s cubic-bezier(.5,1.6,.5,1);
}
.div-row:last-child{border-bottom:none}
.div-row .rk{font-size:34px;font-weight:900;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums;line-height:1}
.div-row.r1 .rk{color:var(--gold)}
.div-row.r2 .rk{color:var(--silver)}
.div-row.r3 .rk{color:var(--bronze)}
.div-row.r4 .rk{color:var(--d4)}
.div-row .lg{
  width:54px;height:54px;background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;border:1px solid var(--border);
}
.div-row .lg img{max-width:46px;max-height:46px;object-fit:contain}
.div-row .lg-empty{font-size:15px;font-weight:900;color:var(--muted);letter-spacing:1px}
.div-row .nm{display:flex;flex-direction:column;min-width:0;justify-content:center;gap:2px}
.div-row .nm-name{font-size:26px;font-weight:900;letter-spacing:1px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1;color:var(--text)}
.div-row .nm-tag{font-size:19px;color:var(--accent);letter-spacing:3px;font-weight:900;text-transform:uppercase;line-height:1}
.div-row .pts{font-size:30px;font-weight:900;color:var(--accent);font-variant-numeric:tabular-nums;text-align:center;min-width:46px;line-height:1}
.div-row .vd{font-size:16px;color:var(--muted);font-weight:800;letter-spacing:.5px;font-variant-numeric:tabular-nums;text-align:center;min-width:50px}
.div-row .md{font-size:19px;font-weight:900;font-variant-numeric:tabular-nums;text-align:center;min-width:50px;line-height:1}
.div-row .md.pos{color:var(--success)}
.div-row .md.neg{color:var(--danger)}
.div-row .md.zero{color:var(--muted)}
.div-empty{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;color:var(--muted);text-align:center;padding:20px}
.div-empty .ic{font-size:40px;opacity:.3;margin-bottom:10px}
.div-empty .lb{font-size:12px;font-weight:800;letter-spacing:3px;text-transform:uppercase}

.div-row.flash-up{background:linear-gradient(90deg, rgba(51,204,102,.18) 0%, transparent 100%);animation:flashFade 1.2s ease-out}
.div-row.flash-down{background:linear-gradient(90deg, rgba(255,51,51,.18) 0%, transparent 100%);animation:flashFade 1.2s ease-out}
@keyframes flashFade{0%{opacity:.5}100%{opacity:1}}

/* ──────── COLONNE DROITE — CARROUSEL ──────── */
.right-carousel{
  display:flex;flex-direction:column;
  background:var(--bg2);border:1px solid var(--border);overflow:hidden;
  position:relative;min-height:0;
  transition:background 1s ease, border-color 1s ease, opacity 1s ease;
}
.right-carousel.empty{
  background:rgba(14,14,14,.35);
  border-color:rgba(255,255,255,.04);
  animation:fadeBreath 4s ease-in-out infinite;
}
.right-carousel.empty .right-carousel-header{
  background:rgba(0,0,0,.15);
  border-bottom-color:rgba(255,255,255,.04);
  opacity:.6;
}
.right-carousel.empty .rc-h-title{
  color:rgba(224,90,58,.4);
}
.right-carousel-header{
  padding:12px 18px;background:rgba(0,0,0,.4);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0;
}
.rc-h-title{font-size:17px;font-weight:900;letter-spacing:5px;color:var(--accent);text-transform:uppercase}
.rc-h-dots{display:flex;gap:4px}
.rc-h-dot{width:18px;height:3px;background:var(--muted2);transition:all .3s}
.rc-h-dot.on{background:var(--accent);width:30px}

.rc-body{flex:1;position:relative;min-height:0;overflow:hidden}
.rc-slide{
  position:absolute;inset:0;opacity:0;
  transform:translateX(40px) scale(.96);
  filter:blur(6px);
  transition:opacity .9s cubic-bezier(.2,.65,.3,1), transform .9s cubic-bezier(.2,.65,.3,1), filter .9s cubic-bezier(.2,.65,.3,1);
  pointer-events:none;display:flex;flex-direction:column;
  will-change:opacity, transform, filter;
}
.rc-slide.on{
  opacity:1;
  transform:translateX(0) scale(1);
  filter:blur(0);
  pointer-events:auto;
}
.rc-slide.exiting{
  opacity:0;
  transform:translateX(-40px) scale(.96);
  filter:blur(6px);
}
.rc-slide.on{opacity:1;pointer-events:auto}

/* Slide MVP */
.rc-mvp-period{
  font-size:22px;font-weight:900;letter-spacing:5px;color:var(--text);text-transform:uppercase;
  padding:18px 22px;border-bottom:1px solid var(--border);background:rgba(0,0,0,.3);
}
.rc-mvp-period span{color:var(--muted);font-size:17px;font-weight:700;letter-spacing:3px;display:block;margin-top:5px}
.rc-mvp-list{flex:1;display:flex;flex-direction:column;justify-content:space-around;padding:14px 18px;min-height:0}
.rc-mvp-row{
  display:grid;grid-template-columns:42px 64px 1fr auto;gap:14px;align-items:center;
  padding:10px 6px;border-bottom:1px dashed var(--border);
}
.rc-mvp-row:last-child{border-bottom:none}
.rc-mvp-rk{font-size:30px;font-weight:900;text-align:center;line-height:1;font-variant-numeric:tabular-nums;color:var(--muted)}
.rc-mvp-rk.r1{color:var(--gold)}
.rc-mvp-rk.r2{color:var(--silver)}
.rc-mvp-rk.r3{color:var(--bronze)}
.rc-mvp-photo{
  width:60px;height:60px;background:linear-gradient(135deg, var(--bg3), var(--bg4));
  display:flex;align-items:center;justify-content:center;border:1px solid var(--border);
  font-size:18px;font-weight:900;color:var(--muted);letter-spacing:1px;
}
.rc-mvp-info{min-width:0}
.rc-mvp-name{font-size:17px;font-weight:900;letter-spacing:1px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1}
.rc-mvp-team-mini{font-size:11px;color:var(--muted);letter-spacing:2px;font-weight:700;margin-top:4px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc-mvp-stats{text-align:right;font-variant-numeric:tabular-nums;line-height:1.1}
.rc-mvp-kda{font-size:13px;color:var(--text);font-weight:800;letter-spacing:.5px}
.rc-mvp-ratio{font-size:22px;font-weight:900;color:var(--accent);letter-spacing:1px;display:block;margin-top:3px}

/* ──────── MINI-PODIUM MVP LIVE (top 3 en escalier + suivants en liste) ──────── */
.rc-mvp-mini{
  flex:1;display:flex;flex-direction:column;min-height:0;
  padding:12px 14px 12px;gap:10px;
}

/* Top 3 podium - prend ~40% de la hauteur en mode live (pour laisser place à la liste) */
.rc-mvp-top3{
  flex:0 0 40%;
  display:flex;align-items:stretch;justify-content:center;gap:10px;
  flex-shrink:0;
}

/* Variante overview : le top 3 prend toute la hauteur (pas de liste suivants) */
.rc-mvp-mini-overview{padding:18px 18px 22px}
.rc-mvp-top3-only{
  flex:1;
  gap:18px;
  align-items:stretch;
  justify-content:center;
}

/* ──────── PODIUM MVP v6 — photo PLEIN CADRE + socle bas ──────── */
/* Cards : remplissent tout l'espace disponible (largeur ET hauteur du wrapper) */
.rc-mvp-spot{
  flex:1 1 0;
  min-width:0;
  max-width:360px;
  height:100%;
  display:block;
  background:#0f0f0f;
  border:1px solid var(--border);
  position:relative;overflow:hidden;
}
/* Logo équipe en filigrane plein fond */
.rc-mvp-spot::before{
  content:'';position:absolute;inset:0;z-index:0;
  background-image:var(--logo-url, none);
  background-repeat:no-repeat;background-position:center;background-size:cover;
  opacity:.10;filter:grayscale(.15);
  pointer-events:none;
}
.rc-mvp-spot.r1::before{opacity:.14}
.rc-mvp-spot > *:not(.rc-mvp-spot-photo):not(.rc-mvp-spot-fallback):not(.rc-mvp-spot-info){position:relative;z-index:3}

/* Photo joueur PLEIN CADRE (inset:0, prend toute la carte)
   cover = remplit toute la largeur, le bas (jambes) sera masqué par le socle info */
.rc-mvp-spot-photo{
  position:absolute;inset:0;z-index:1;
  pointer-events:none;
  background-position:center top;
  background-repeat:no-repeat;
  background-size:cover;
  filter:drop-shadow(0 4px 20px rgba(0,0,0,.5));
}
.rc-mvp-spot.r1 .rc-mvp-spot-photo{filter:drop-shadow(0 4px 24px rgba(245,200,66,.45)) drop-shadow(0 0 12px rgba(245,200,66,.25))}
.rc-mvp-spot.r2 .rc-mvp-spot-photo{filter:drop-shadow(0 4px 24px rgba(200,200,200,.4)) drop-shadow(0 0 10px rgba(200,200,200,.2))}
.rc-mvp-spot.r3 .rc-mvp-spot-photo{filter:drop-shadow(0 4px 24px rgba(205,127,50,.4)) drop-shadow(0 0 10px rgba(205,127,50,.2))}
.rc-mvp-spot.has-photo::before{opacity:.08}
.rc-mvp-spot.has-photo.r1::before{opacity:.12}

/* Couleurs de bordure or/argent/bronze */
.rc-mvp-spot.r1{order:2;border-color:rgba(245,200,66,.6);box-shadow:0 0 24px rgba(245,200,66,.18)}
.rc-mvp-spot.r2{order:1;border-color:rgba(200,200,200,.5)}
.rc-mvp-spot.r3{order:3;border-color:rgba(205,127,50,.5)}
/* Effet escalier : alignés en bas, hauteur réduite pour r2/r3 */
.rc-mvp-spot.r1{height:100%;align-self:flex-end}
.rc-mvp-spot.r2{height:92%;align-self:flex-end}
.rc-mvp-spot.r3{height:84%;align-self:flex-end}

/* Variante "big" : podium fait toute la hauteur du carrousel
   Même aspect-ratio vertical, hérité de .rc-mvp-spot */
.rc-mvp-spot-big{}

/* Fallback texte si pas de logo ni photo */
.rc-mvp-spot-fallback{
  position:absolute;inset:0;z-index:0;display:flex;align-items:center;justify-content:center;
  font-size:60px;font-weight:900;letter-spacing:6px;color:var(--text);
  opacity:.06;pointer-events:none;
}
.rc-mvp-spot-big .rc-mvp-spot-fallback{font-size:90px}

/* ──────── Socle bas : nom + équipe centrés, ratio | kda+maps en bas ──────── */
.rc-mvp-spot-info{
  position:absolute;left:0;right:0;bottom:0;z-index:3;
  padding:10px 11px 11px;
  background:linear-gradient(180deg,
    rgba(0,0,0,0) 0%,
    rgba(0,0,0,.6) 35%,
    rgba(0,0,0,.92) 70%,
    rgba(0,0,0,.98) 100%);
  max-height:42%;
  display:flex;flex-direction:column;justify-content:flex-end;
}
.rc-mvp-spot-name{
  font-size:22px;font-weight:900;letter-spacing:.8px;text-transform:uppercase;line-height:1.05;
  color:var(--text);width:100%;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-align:center;
  text-shadow:0 2px 8px rgba(0,0,0,.85);
}
.rc-mvp-spot.r1 .rc-mvp-spot-name{font-size:26px}
.rc-mvp-spot-team{
  font-size:13px;letter-spacing:1.5px;font-weight:700;text-transform:uppercase;
  color:rgba(255,255,255,.7);
  margin-top:4px;width:100%;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-align:center;
  text-shadow:0 1px 6px rgba(0,0,0,.85);
}
.rc-mvp-spot.r1 .rc-mvp-spot-team{color:rgba(245,200,66,.95);font-size:14px}
.rc-mvp-spot.r2 .rc-mvp-spot-team{color:rgba(200,200,200,.95)}
.rc-mvp-spot.r3 .rc-mvp-spot-team{color:rgba(205,127,50,.95)}
.rc-mvp-spot-stats{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  border-top:1px solid rgba(255,255,255,.18);
  padding-top:8px;margin-top:8px;width:100%;min-width:0;
}
.rc-mvp-spot-ratio{
  font-size:38px;font-weight:900;color:var(--accent);font-variant-numeric:tabular-nums;
  line-height:1;text-align:center;
  text-shadow:0 2px 8px rgba(0,0,0,.85);
}
.rc-mvp-spot.r1 .rc-mvp-spot-ratio{font-size:46px;color:var(--gold)}
.rc-mvp-spot.r2 .rc-mvp-spot-ratio{color:var(--silver)}
.rc-mvp-spot.r3 .rc-mvp-spot-ratio{color:var(--bronze)}
.rc-mvp-spot-stats-right{
  text-align:center;line-height:1.1;width:100%;
  display:flex;flex-direction:column;align-items:center;gap:2px;
}
.rc-mvp-spot-kda{
  font-size:18px;color:#fff;font-weight:900;letter-spacing:.5px;font-variant-numeric:tabular-nums;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;
  text-shadow:0 1px 4px rgba(0,0,0,.85);
}
.rc-mvp-spot.r1 .rc-mvp-spot-kda{font-size:20px}
.rc-mvp-spot-maps{
  font-size:12px;color:rgba(255,255,255,.7);font-weight:800;letter-spacing:1.4px;
  text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;
  text-shadow:0 1px 4px rgba(0,0,0,.85);
}
.rc-mvp-spot.r1 .rc-mvp-spot-maps{font-size:13px}

/* Variante big (overview carrousel) : sensiblement plus gros pour la TV */
.rc-mvp-spot-big .rc-mvp-spot-info{padding:12px 13px 13px;max-height:44%}
.rc-mvp-spot-big .rc-mvp-spot-name{font-size:26px}
.rc-mvp-spot-big.r1 .rc-mvp-spot-name{font-size:32px}
.rc-mvp-spot-big .rc-mvp-spot-team{font-size:14px;margin-top:5px}
.rc-mvp-spot-big.r1 .rc-mvp-spot-team{font-size:16px}
.rc-mvp-spot-big .rc-mvp-spot-stats{padding-top:10px;margin-top:10px;gap:5px}
.rc-mvp-spot-big .rc-mvp-spot-ratio{font-size:46px}
.rc-mvp-spot-big.r1 .rc-mvp-spot-ratio{font-size:56px}
.rc-mvp-spot-big .rc-mvp-spot-kda{font-size:22px}
.rc-mvp-spot-big.r1 .rc-mvp-spot-kda{font-size:26px}
.rc-mvp-spot-big .rc-mvp-spot-maps{font-size:14px}
.rc-mvp-spot-big.r1 .rc-mvp-spot-maps{font-size:16px}
.rc-mvp-spot-big .rc-mvp-spot-maps{font-size:10px}
.rc-mvp-spot-big.r1 .rc-mvp-spot-maps{font-size:12px}

/* Liste des suivants : prend tout le reste (60% environ) */
.rc-mvp-rest{
  flex:1;display:flex;flex-direction:column;min-height:0;
  border-top:1px dashed var(--border);padding-top:8px;
}
.rc-mvp-rest-head{
  font-size:16px;font-weight:900;letter-spacing:3px;color:var(--accent);text-transform:uppercase;
  margin-bottom:8px;padding-left:4px;flex-shrink:0;
}
.rc-mvp-rest-list{
  flex:1;display:flex;flex-direction:column;
  overflow:hidden;justify-content:flex-start;gap:0;
}
.rc-mvp-rest-row{
  display:grid;grid-template-columns:38px 1fr auto;gap:14px;align-items:center;
  padding:11px 12px;
  font-size:14px;font-weight:700;
  border-bottom:1px dashed rgba(255,255,255,.05);
}
.rc-mvp-rest-row:last-child{border-bottom:none}
.rc-mvp-rest-rk{font-size:28px;font-weight:900;color:var(--muted2);text-align:center;font-variant-numeric:tabular-nums;line-height:1}
.rc-mvp-rest-info{
  display:flex;flex-direction:column;gap:4px;min-width:0;
}
.rc-mvp-rest-name{
  font-size:24px;font-weight:900;letter-spacing:.8px;text-transform:uppercase;color:var(--text);line-height:1.1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.rc-mvp-rest-team{
  font-size:16px;color:var(--muted);letter-spacing:1.5px;font-weight:700;text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.rc-mvp-rest-ratio{
  font-size:30px;font-weight:900;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1;
}

/* Slide MOUVEMENTS (promus + relégués fusionnés sur une seule slide) */
.rc-mv-header{
  padding:14px 22px;border-bottom:1px solid var(--border);background:rgba(0,0,0,.3);flex-shrink:0;
}
.rc-mv-title{font-size:26px;font-weight:900;letter-spacing:4px;text-transform:uppercase;line-height:1}
.rc-mv-sub{font-size:16px;color:var(--muted);letter-spacing:3px;font-weight:700;text-transform:uppercase;margin-top:6px}
.rc-mv-list{flex:1;display:flex;flex-direction:column;padding:10px 18px 12px;gap:4px;min-height:0}
.rc-mv-row{
  display:flex;align-items:center;gap:16px;padding:8px 14px;
  background:var(--bg3);border:1px solid var(--border);border-left:4px solid var(--success);
  flex:1;min-height:0;overflow:hidden;
}
.rc-mv-row.down{border-left-color:var(--danger)}
.rc-mv-arrow{font-size:26px;font-weight:900;color:var(--success);line-height:1;flex-shrink:0;width:20px;text-align:center}
.rc-mv-row.down .rc-mv-arrow{color:var(--danger)}
.rc-mv-logo{
  width:64px;height:64px;background:var(--bg);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  border:1px solid var(--border);overflow:hidden;
}
.rc-mv-logo img{max-width:56px;max-height:56px;object-fit:contain}
.rc-mv-logo-empty{font-size:17px;font-weight:900;color:var(--muted);letter-spacing:1.5px}
.rc-mv-info{
  flex:1;min-width:0;display:flex;align-items:center;gap:14px;overflow:hidden;
}
.rc-mv-name{
  font-size:24px;font-weight:900;letter-spacing:1px;text-transform:uppercase;line-height:1;
  flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.rc-mv-divs{
  font-size:20px;color:var(--muted);letter-spacing:1.5px;font-weight:900;
  flex-shrink:0;font-variant-numeric:tabular-nums;
  display:flex;align-items:center;gap:8px;white-space:nowrap;
}
.rc-mv-divs strong{color:var(--text);font-size:24px}
.rc-mv-divs-arrow{color:var(--muted2);font-size:18px}
.rc-mv-row.up .rc-mv-divs strong:last-child{color:var(--success)}
.rc-mv-row.down .rc-mv-divs strong:last-child{color:var(--danger)}

/* Slide image (infos salle) */
.rc-image{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;background-size:cover;background-position:center}
.rc-image::before{content:'';position:absolute;inset:0;background:linear-gradient(to top, rgba(0,0,0,.92) 0%, rgba(0,0,0,.6) 35%, transparent 75%)}
.rc-image-content{position:relative;padding:30px 26px;z-index:2}
.rc-image-badge{
  display:inline-block;font-size:17px;font-weight:900;letter-spacing:3px;text-transform:uppercase;
  padding:7px 16px;margin-bottom:14px;background:var(--accent);color:#000;
}
.rc-image-badge.violet{background:#9D6BFF}
.rc-image-badge.cyan{background:#00E5FF}
.rc-image-badge.magenta{background:#FF2D95}
.rc-image-badge.green{background:var(--success)}
.rc-image-badge.gold{background:var(--gold);color:#000}
.rc-image-title{font-size:48px;font-weight:900;letter-spacing:2px;text-transform:uppercase;line-height:1.1;color:var(--text);text-shadow:0 2px 12px rgba(0,0,0,.6)}
.rc-image-subtitle{font-size:23px;font-weight:600;letter-spacing:1px;color:rgba(255,255,255,.92);margin-top:12px;line-height:1.4}

/* Empty slide */
.rc-empty{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;color:var(--muted);text-align:center;padding:30px;animation:fadeContent 3s ease-in-out infinite}
@keyframes fadeContent{
  0%,100%{opacity:.7}
  50%{opacity:.35}
}
.rc-empty-ic{font-size:50px;opacity:.3;margin-bottom:14px}
.rc-empty-lb{font-size:14px;font-weight:800;letter-spacing:3px;text-transform:uppercase}

/* ════════════════════════════════════════════════════════════════════
   MODE LIVE
   ════════════════════════════════════════════════════════════════════ */
.mode-live{display:grid;grid-template-columns:65fr 35fr;gap:18px;height:100%}
.live-main{display:flex;flex-direction:column;gap:14px;min-height:0}

.live-banner{
  background:linear-gradient(135deg, rgba(224,90,58,.12) 0%, rgba(8,8,8,.5) 100%);
  border:1px solid rgba(224,90,58,.4);border-left:4px solid var(--accent);
  padding:14px 22px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;
}
.live-banner-title{
  font-size:13px;font-weight:900;letter-spacing:5px;color:var(--accent);text-transform:uppercase;
  display:flex;align-items:center;gap:10px;
}
.live-banner-title::before{
  content:'';width:12px;height:12px;background:#FFFFFF;border-radius:50%;
  box-shadow:0 0 10px rgba(255,255,255,.8);
  animation:blinkLive 1.4s ease-in-out infinite;
}
@keyframes blinkLive{0%,50%{opacity:1;transform:scale(1)}51%,100%{opacity:.3;transform:scale(.85)}}
.live-banner-div{font-size:46px;font-weight:900;letter-spacing:8px;text-transform:uppercase;color:var(--text);line-height:1;margin-top:4px}
.live-banner-div span{color:var(--accent)}
.live-banner-meta{font-size:13px;color:var(--muted);letter-spacing:3px;text-transform:uppercase;font-weight:700;text-align:right}
.live-banner-meta strong{color:var(--text);font-weight:900;display:block;font-size:17px;margin-top:4px;letter-spacing:2px}

.live-standings-card{
  flex:1;background:var(--bg2);border:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;min-height:0;
}
.live-card-title{
  font-size:17px;font-weight:900;letter-spacing:5px;text-transform:uppercase;color:var(--accent);
  padding:14px 22px;border-bottom:1px solid var(--border);background:rgba(0,0,0,.3);
}
.live-th{
  display:grid;grid-template-columns:60px 70px 1fr 90px 90px 100px 100px;
  gap:14px;padding:10px 22px;border-bottom:2px solid var(--border2);
  font-size:13px;font-weight:900;letter-spacing:3px;color:var(--muted);text-transform:uppercase;
}
.live-th div{text-align:center}
.live-th div:nth-child(3){text-align:left;padding-left:10px}

.live-standings-body{flex:1;overflow:hidden;padding:6px 14px;display:flex;flex-direction:column}

.live-row{
  display:grid;grid-template-columns:60px 70px 1fr 90px 90px 100px 100px;
  gap:14px;align-items:center;padding:14px 14px;
  border-bottom:1px dashed var(--border);transition:transform .65s cubic-bezier(.5,1.6,.5,1);
  flex:1;
}
.live-row:last-child{border-bottom:none}
.live-row .rk{font-size:38px;font-weight:900;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums;line-height:1}
.live-row.r1 .rk{color:var(--gold)}
.live-row.r2 .rk{color:var(--silver)}
.live-row.r3 .rk{color:var(--bronze)}
.live-row.r4 .rk{color:var(--d4)}
.live-row .lg{width:62px;height:62px;background:var(--bg);display:flex;align-items:center;justify-content:center;border:1px solid var(--border)}
.live-row .lg img{max-width:54px;max-height:54px;object-fit:contain}
.live-row .lg-empty{font-size:14px;font-weight:900;color:var(--muted)}

.live-row .team-block{display:flex;flex-direction:column;justify-content:center;min-width:0;gap:6px}
.live-row .nm-name{font-size:34px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1}
.live-row .nm-tag{font-size:17px;color:var(--accent);letter-spacing:3px;font-weight:800;text-transform:uppercase}
.live-row .nm-roster{
  font-size:20px;color:var(--muted);letter-spacing:1.5px;font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-transform:uppercase;
}
.live-row .nm-roster span{color:var(--text);font-weight:800}
.live-row .nm-roster span + span::before{content:' · ';color:var(--muted2)}

.live-row .pts{font-size:40px;font-weight:900;color:var(--live);text-align:center;font-variant-numeric:tabular-nums;line-height:1}
.live-row .vd{font-size:17px;color:var(--muted);font-weight:800;text-align:center;letter-spacing:1px;font-variant-numeric:tabular-nums}
.live-row .md{font-size:22px;font-weight:900;text-align:center;font-variant-numeric:tabular-nums;line-height:1}
.live-row .md.pos{color:var(--success)}
.live-row .md.neg{color:var(--danger)}
.live-row .md.zero{color:var(--muted)}
.live-row .pd{font-size:19px;font-weight:900;text-align:center;font-variant-numeric:tabular-nums;line-height:1}
.live-row .pd.pos{color:var(--success)}
.live-row .pd.neg{color:var(--danger)}
.live-row .pd.zero{color:var(--muted)}
.live-row.flash-up{background:linear-gradient(90deg, rgba(51,204,102,.2) 0%, transparent 100%);animation:flashFade 1.2s}
.live-row.flash-down{background:linear-gradient(90deg, rgba(255,51,51,.2) 0%, transparent 100%);animation:flashFade 1.2s}

/* ──────── LIVE — colonne droite carrousel ──────── */
.live-rc-section{flex:1;display:flex;flex-direction:column;min-height:0}

/* Matches list (live carousel slide) */
.rc-matches-list{
  flex:1;display:flex;flex-direction:column;
  padding:4px 8px;overflow:hidden;min-height:0;
  justify-content:flex-start;
  gap:3px;
}
.match-line{
  display:grid;grid-template-columns:auto 1fr auto 1fr;gap:10px;
  align-items:center;padding:8px 10px;
  background:var(--bg3);border:1px solid var(--border);
  flex-shrink:0;
}
.match-line.done{opacity:.6;background:rgba(20,20,20,.5)}
.match-line-time-block{
  display:flex;flex-direction:column;align-items:center;
  font-variant-numeric:tabular-nums;line-height:1;flex-shrink:0;
  min-width:74px;
}
.match-line-time{
  font-size:36px;font-weight:900;color:var(--accent);letter-spacing:1px;line-height:1;
}
.match-line.done .match-line-time{color:var(--success)}
.match-line-status-mini{
  font-size:12px;font-weight:900;letter-spacing:2.5px;color:var(--muted2);text-transform:uppercase;margin-top:5px;
}
.match-line.done .match-line-status-mini{color:var(--success)}

.match-line-team{
  display:flex;align-items:center;gap:10px;
  font-size:28px;font-weight:900;letter-spacing:.8px;text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  min-width:0;
}
.match-line-team.r{justify-content:flex-end;text-align:right}
.match-line-team img{
  width:68px;height:68px;object-fit:contain;flex-shrink:0;
  background:var(--bg);padding:3px;border:1px solid var(--border);
}
.match-line-team-name{overflow:hidden;text-overflow:ellipsis;min-width:0}
.match-line-team.win{color:var(--success)}

.match-line-score{
  font-size:42px;font-weight:900;color:var(--text);text-align:center;
  font-variant-numeric:tabular-nums;letter-spacing:3px;line-height:1;
  padding:8px 14px;background:rgba(0,0,0,.4);border:1px solid var(--border);
  min-width:96px;flex-shrink:0;
}
.match-line-score.pending{color:var(--muted);font-size:26px;letter-spacing:3px;font-weight:800}

/* Empty / loader */
.empty-state{display:flex;align-items:center;justify-content:center;flex-direction:column;height:100%;color:var(--muted);padding:30px;text-align:center}
.empty-state .ic{font-size:50px;opacity:.3;margin-bottom:12px}
.empty-state .lb{font-size:14px;font-weight:800;letter-spacing:3px;text-transform:uppercase}
.empty-state .sb{font-size:13px;color:var(--muted2);letter-spacing:2px;font-weight:700;margin-top:8px}

/* ════════════════════════════════════════════════════════════════════
   MODE CÉRÉMONIE PODIUM
   ════════════════════════════════════════════════════════════════════ */
.mode-ceremony{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100%;position:relative;padding:40px;
}

/* Header cérémonie */
.ceremony-header{
  position:absolute;top:0;left:0;right:0;text-align:center;
  padding:30px 40px;
  opacity:0;transform:translateY(-20px);
  transition:opacity 1s ease, transform 1s ease;
}
.ceremony-header.in{opacity:1;transform:translateY(0)}
.ceremony-h-overline{
  font-size:13px;font-weight:900;letter-spacing:8px;color:var(--accent);text-transform:uppercase;
  margin-bottom:10px;
}
.ceremony-h-title{
  font-size:48px;font-weight:900;letter-spacing:6px;text-transform:uppercase;line-height:1;color:var(--text);
}
.ceremony-h-sub{
  font-size:14px;font-weight:700;letter-spacing:4px;color:var(--muted);text-transform:uppercase;
  margin-top:14px;
}

/* Phase de transition entre le banner d'intro et le podium */
.ceremony-intro{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:30px;pointer-events:none;
  opacity:0;transition:opacity 1.2s ease;
}
.ceremony-intro.in{opacity:1}
.ceremony-intro-icon{
  font-size:120px;opacity:.85;
  animation:trophyShine 2.4s ease-in-out infinite;
  filter:drop-shadow(0 4px 24px rgba(245,200,66,.6));
}
@keyframes trophyShine{
  0%,100%{transform:scale(1) rotate(-3deg);filter:drop-shadow(0 4px 24px rgba(245,200,66,.6))}
  50%{transform:scale(1.08) rotate(3deg);filter:drop-shadow(0 4px 36px rgba(245,200,66,.95))}
}
.ceremony-intro-text{
  font-size:64px;font-weight:900;letter-spacing:10px;text-transform:uppercase;line-height:1;
  background:linear-gradient(135deg, var(--accent) 0%, var(--gold) 50%, var(--accent2) 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  text-shadow:0 0 60px rgba(224,90,58,.4);
}
.ceremony-intro-sub{
  font-size:18px;font-weight:700;letter-spacing:6px;color:var(--text);text-transform:uppercase;
}

/* Podium principal (4 colonnes équipes/joueurs) */
.podium-wrap{
  display:flex;align-items:flex-end;justify-content:center;gap:24px;
  width:100%;max-width:1500px;margin-top:auto;margin-bottom:auto;
  perspective:1200px;
}

.podium-slot{
  flex:1;max-width:330px;display:flex;flex-direction:column;align-items:stretch;
  opacity:0;transform:translateY(120px) scale(.85);
  transition:opacity 1s cubic-bezier(.2,.7,.3,1), transform 1s cubic-bezier(.2,.7,.3,1);
  position:relative;
}
.podium-slot.in{opacity:1;transform:translateY(0) scale(1)}
.podium-slot.r1{order:2}    /* 1er au centre */
.podium-slot.r2{order:1}    /* 2ème à gauche */
.podium-slot.r3{order:3}    /* 3ème à droite */
.podium-slot.r4{order:4}    /* 4ème tout à droite, plus petit */

/* Card : TOUJOURS la même hauteur visuelle (pas de chevauchement)
   La hiérarchie visuelle vient des socles (qui poussent les cards plus haut/bas)
   et des effets (glow + médaille pulsée pour le 1er) */
.podium-card{
  background:linear-gradient(135deg, var(--bg2) 0%, var(--bg3) 100%);
  border:1px solid var(--border);
  width:100%;height:430px;
  padding:30px 20px 20px 20px;text-align:center;position:relative;
  display:flex;flex-direction:column;align-items:center;
  overflow:hidden;
}
.podium-slot.r1 .podium-card{
  height:480px; /* le 1er a une card un peu plus haute (médaille + logo plus grands) */
  border-color:rgba(245,200,66,.55);
  background:linear-gradient(135deg, rgba(245,200,66,.08) 0%, var(--bg3) 100%);
  box-shadow:0 0 60px rgba(245,200,66,.18), inset 0 0 30px rgba(245,200,66,.05);
}
.podium-slot.r2 .podium-card{border-color:rgba(200,200,200,.45);background:linear-gradient(135deg, rgba(200,200,200,.05) 0%, var(--bg3) 100%)}
.podium-slot.r3 .podium-card{border-color:rgba(205,127,50,.45);background:linear-gradient(135deg, rgba(205,127,50,.06) 0%, var(--bg3) 100%)}
.podium-slot.r4 .podium-card{
  height:380px; /* le 4ème un peu plus court */
  border-color:rgba(140,45,23,.55);background:linear-gradient(135deg, rgba(140,45,23,.08) 0%, var(--bg3) 100%);
}

.podium-medal{
  font-size:56px;line-height:1;margin:0 auto 12px;
  flex-shrink:0;height:62px;display:flex;align-items:center;
}
.podium-slot.r1 .podium-medal{font-size:76px;height:84px;animation:medalPulse 1.8s ease-in-out infinite}
.podium-slot.r4 .podium-medal{font-size:48px;height:54px}
@keyframes medalPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

.podium-logo{
  width:106px;height:106px;background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 12px;border:2px solid var(--border2);
  position:relative;flex-shrink:0;
}
.podium-slot.r1 .podium-logo{
  width:130px;height:130px;border-color:var(--gold);
  box-shadow:0 0 40px rgba(245,200,66,.4);
}
.podium-slot.r2 .podium-logo{border-color:var(--silver);width:114px;height:114px}
.podium-slot.r3 .podium-logo{border-color:var(--bronze);width:106px;height:106px}
.podium-slot.r4 .podium-logo{width:92px;height:92px}
.podium-logo img{max-width:88%;max-height:88%;object-fit:contain}
.podium-logo-empty{font-size:20px;font-weight:900;color:var(--muted);letter-spacing:1px}

/* Style spécifique photo MVP (rond, plus prononcé) */
.podium-logo.mvp-photo{
  border-radius:50%;
  background:linear-gradient(135deg, var(--bg3) 0%, var(--bg4) 100%);
}
.podium-logo.mvp-photo .mvp-initials{
  font-size:32px;color:var(--accent);font-weight:900;letter-spacing:2px;
}
.podium-slot.r1 .podium-logo.mvp-photo .mvp-initials{font-size:42px;color:var(--gold)}
.podium-slot.r2 .podium-logo.mvp-photo .mvp-initials{font-size:36px;color:var(--silver)}
.podium-slot.r3 .podium-logo.mvp-photo .mvp-initials{font-size:32px;color:var(--bronze)}

/* ────── Card MVP cérémonie podium v6 — photo PLEIN CADRE + socle bas ────── */
.podium-slot.r1 .podium-card.mvp{height:440px}
.podium-slot.r2 .podium-card.mvp,
.podium-slot.r3 .podium-card.mvp{height:380px}

.podium-card.mvp{
  padding:0;
  position:relative;overflow:hidden;
  display:block; /* on quitte le flex pour permettre absolute des éléments */
}
/* Logo équipe en filigrane plein fond */
.podium-card.mvp::before{
  content:'';position:absolute;inset:0;z-index:0;
  background-image:var(--logo-url, none);
  background-repeat:no-repeat;background-position:center;background-size:cover;
  opacity:.12;filter:grayscale(.15);
  pointer-events:none;
}
.podium-slot.r1 .podium-card.mvp::before{opacity:.16}
.podium-card.mvp.has-photo::before{opacity:.08}
.podium-slot.r1 .podium-card.mvp.has-photo::before{opacity:.12}

/* Fallback texte si pas de logo ni photo */
.podium-card-fallback{
  position:absolute;inset:0;z-index:0;display:flex;align-items:center;justify-content:center;
  font-size:120px;font-weight:900;letter-spacing:8px;color:var(--text);
  opacity:.05;pointer-events:none;
}

/* Photo joueur PLEIN CADRE (inset:0 — toute la carte)
   cover = remplit toute la largeur, le bas (jambes) sera masqué par le socle info */
.podium-card-photo{
  position:absolute;inset:0;z-index:1;
  pointer-events:none;
  background-position:center top;
  background-repeat:no-repeat;
  background-size:cover;
  filter:drop-shadow(0 6px 28px rgba(0,0,0,.55));
}
.podium-slot.r1 .podium-card-photo{filter:drop-shadow(0 6px 32px rgba(245,200,66,.5)) drop-shadow(0 0 14px rgba(245,200,66,.3))}
.podium-slot.r2 .podium-card-photo{filter:drop-shadow(0 6px 28px rgba(200,200,200,.4)) drop-shadow(0 0 10px rgba(200,200,200,.2))}
.podium-slot.r3 .podium-card-photo{filter:drop-shadow(0 6px 28px rgba(205,127,50,.4)) drop-shadow(0 0 10px rgba(205,127,50,.2))}

/* Socle bas — nom + équipe centrés, ratio | kda+maps */
.podium-card.mvp .podium-info{
  position:absolute;left:0;right:0;bottom:0;z-index:3;
  padding:12px 16px 14px;
  background:linear-gradient(180deg,
    rgba(0,0,0,0) 0%,
    rgba(0,0,0,.6) 35%,
    rgba(0,0,0,.92) 70%,
    rgba(0,0,0,.98) 100%);
  max-height:36%;
  display:flex;flex-direction:column;justify-content:flex-end;
}
.podium-card.mvp .podium-text{
  width:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  margin:0 0 8px;
}
.podium-card.mvp .podium-stats{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  width:100%;
  border-top:1px solid rgba(255,255,255,.18);
  padding-top:10px;margin:0;
}
.podium-card.mvp .podium-stats > div{min-width:0;text-align:center;width:100%}
.podium-card.mvp .podium-stats .pts{text-align:center}
.podium-card.mvp .podium-stats .pts strong{
  font-size:42px;color:var(--accent);font-weight:900;
  display:block;line-height:1;text-shadow:0 2px 8px rgba(0,0,0,.85);
}
.podium-slot.r1 .podium-card.mvp .podium-stats .pts strong{font-size:54px;color:var(--gold)}
.podium-slot.r2 .podium-card.mvp .podium-stats .pts strong{color:var(--silver)}
.podium-slot.r3 .podium-card.mvp .podium-stats .pts strong{color:var(--bronze)}
.podium-card.mvp .podium-stats > div:not(.pts){
  text-align:center;font-size:0;
  color:rgba(255,255,255,.7);
  text-shadow:0 1px 4px rgba(0,0,0,.85);
}
.podium-card.mvp .podium-stats > div:not(.pts) strong{
  display:inline-block;color:#fff;font-weight:900;font-size:20px;letter-spacing:.5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;
  text-shadow:0 1px 4px rgba(0,0,0,.85);
}
.podium-slot.r1 .podium-card.mvp .podium-stats > div:not(.pts) strong{font-size:24px}
/* maps en plus petit que le K/D/A */
.podium-card.mvp .podium-stats > div:not(.pts):last-child strong{
  font-size:13px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;
  color:rgba(255,255,255,.7);
}
.podium-slot.r1 .podium-card.mvp .podium-stats > div:not(.pts):last-child strong{font-size:15px}

/* Bloc nom + tag : centré, hauteur fixe pour ne pas pousser */
.podium-text{
  width:100%;flex-shrink:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  margin-bottom:10px;
}
.podium-name{
  font-size:30px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;line-height:1.1;
  color:var(--text);margin-bottom:6px;
  width:100%;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-shadow:0 2px 8px rgba(0,0,0,.7);
}
.podium-slot.r1 .podium-name{font-size:46px;letter-spacing:2px}
.podium-slot.r4 .podium-name{font-size:24px}
.podium-tag{
  font-size:14px;font-weight:800;letter-spacing:2.5px;text-transform:uppercase;
  color:var(--accent);
  height:18px;line-height:18px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;
  text-shadow:0 1px 4px rgba(0,0,0,.7);
}
.podium-slot.r1 .podium-tag{font-size:16px;height:20px;line-height:20px}

/* Stats en bas : poussées tout en bas avec margin-top:auto, hauteur fixe */
.podium-stats{
  display:flex;justify-content:center;gap:12px;width:100%;
  font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);
  border-top:1px dashed var(--border);padding-top:12px;margin-top:auto;
  flex-shrink:0;
  text-shadow:0 1px 4px rgba(0,0,0,.6);
}
.podium-stats > div{flex:1;min-width:0}
.podium-stats strong{color:var(--text);font-weight:900;font-size:18px;display:block;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.podium-stats .pts strong{color:var(--accent);font-size:24px}

/* Badge mouvement (montée / descente / champion / reste) */
.podium-move{
  display:flex;align-items:center;justify-content:center;gap:10px;
  padding:10px 14px;margin:12px -20px -20px -20px;
  width:calc(100% + 40px);
  font-size:12px;font-weight:900;letter-spacing:2.5px;text-transform:uppercase;line-height:1;
  opacity:0;transform:translateY(20px) scale(.9);
  transition:opacity .9s cubic-bezier(.2,.7,.3,1), transform .9s cubic-bezier(.2,.7,.3,1);
  position:relative;overflow:hidden;
  flex-shrink:0;
}
.podium-move.in{opacity:1;transform:translateY(0) scale(1)}
.podium-move.up{
  background:linear-gradient(90deg, rgba(51,204,102,.18) 0%, rgba(51,204,102,.32) 50%, rgba(51,204,102,.18) 100%);
  color:var(--success);border-top:2px solid var(--success);
  box-shadow:inset 0 0 30px rgba(51,204,102,.18);
}
.podium-move.down{
  background:linear-gradient(90deg, rgba(255,51,51,.18) 0%, rgba(255,51,51,.32) 50%, rgba(255,51,51,.18) 100%);
  color:var(--danger);border-top:2px solid var(--danger);
  box-shadow:inset 0 0 30px rgba(255,51,51,.18);
}
.podium-move.champion{
  background:linear-gradient(90deg, rgba(245,200,66,.18) 0%, rgba(245,200,66,.38) 50%, rgba(245,200,66,.18) 100%);
  color:var(--gold);border-top:2px solid var(--gold);
  box-shadow:inset 0 0 30px rgba(245,200,66,.22);
  animation:championPulse 2.4s ease-in-out infinite;
}
.podium-move.stay{
  background:linear-gradient(90deg, rgba(140,45,23,.2) 0%, rgba(140,45,23,.35) 50%, rgba(140,45,23,.2) 100%);
  color:var(--accent2);border-top:2px solid var(--accent-deep);
  box-shadow:inset 0 0 30px rgba(140,45,23,.22);
}
@keyframes championPulse{
  0%,100%{box-shadow:inset 0 0 30px rgba(245,200,66,.22), 0 0 0 0 rgba(245,200,66,0)}
  50%{box-shadow:inset 0 0 40px rgba(245,200,66,.3), 0 0 30px rgba(245,200,66,.4)}
}

.podium-move-arrow{
  font-size:20px;font-weight:900;line-height:1;display:inline-block;
}
.podium-move.up .podium-move-arrow{
  animation:arrowUp 1.4s ease-in-out infinite;
}
.podium-move.down .podium-move-arrow{
  animation:arrowDown 1.4s ease-in-out infinite;
}
@keyframes arrowUp{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-5px)}
}
@keyframes arrowDown{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(5px)}
}

/* Effet "shine" qui passe sur le badge */
.podium-move::after{
  content:'';position:absolute;top:0;left:-100%;width:50%;height:100%;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.18), transparent);
  animation:shineMove 3s ease-in-out infinite;
}
@keyframes shineMove{
  0%{left:-100%}
  60%,100%{left:200%}
}

/* Hauteur des socles : effet escalier (modéré pour rester dans l'écran) */
.podium-base{
  width:100%;background:var(--bg3);border:1px solid var(--border);border-top:none;
  display:flex;align-items:center;justify-content:center;
  font-size:64px;font-weight:900;letter-spacing:6px;color:rgba(255,255,255,.15);
  -webkit-text-stroke:2px rgba(255,255,255,.25);
  font-variant-numeric:tabular-nums;line-height:1;
  flex-shrink:0;
}
.podium-slot.r1 .podium-base{
  height:170px;font-size:96px;
  color:rgba(245,200,66,.32);-webkit-text-stroke:3px rgba(245,200,66,.7);
  background:linear-gradient(180deg, rgba(245,200,66,.12) 0%, var(--bg3) 100%);
  text-shadow:0 0 40px rgba(245,200,66,.25);
}
.podium-slot.r2 .podium-base{
  height:130px;
  color:rgba(200,200,200,.28);-webkit-text-stroke:3px rgba(200,200,200,.6);
}
.podium-slot.r3 .podium-base{
  height:95px;
  color:rgba(205,127,50,.3);-webkit-text-stroke:3px rgba(205,127,50,.65);
}
.podium-slot.r4 .podium-base{
  height:70px;font-size:54px;
  color:rgba(180,180,180,.2);-webkit-text-stroke:2px rgba(180,180,180,.45);
}

/* Confettis */
.confetti{
  position:absolute;top:-20px;width:10px;height:14px;background:var(--accent);
  opacity:0;pointer-events:none;
  animation:confettiFall 3.5s linear forwards;
}
@keyframes confettiFall{
  0%{transform:translateY(0) rotate(0);opacity:1}
  100%{transform:translateY(100vh) rotate(720deg);opacity:0}
}

/* Bouton retour cérémonie (admin) */
.ceremony-skip-hint{
  position:absolute;bottom:14px;right:20px;
  font-size:10px;color:var(--muted2);letter-spacing:2px;font-weight:700;text-transform:uppercase;
  pointer-events:none;
}


.loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:1000;flex-direction:column;gap:18px}
.loader-logo{height:120px;width:auto;filter:drop-shadow(0 4px 24px rgba(224,90,58,.5));animation:logoLoad 2s ease-in-out infinite}
@keyframes logoLoad{0%,100%{opacity:.5;transform:scale(.96)}50%{opacity:1;transform:scale(1)}}
.loader-text{font-size:13px;letter-spacing:8px;color:var(--accent);font-weight:900;text-transform:uppercase}

/* ════════════════════════════════════════════════════════════════════
   BOUTON FULLSCREEN
   ════════════════════════════════════════════════════════════════════ */
.fs-btn{
  position:fixed;bottom:18px;right:18px;z-index:200;
  width:48px;height:48px;
  background:rgba(8,8,8,.7);backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.15);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .25s ease;
  opacity:.55;
}
.fs-btn:hover{
  opacity:1;
  background:rgba(224,90,58,.18);border-color:rgba(224,90,58,.6);
  transform:scale(1.08);
}
.fs-btn svg{width:22px;height:22px;fill:none;stroke:var(--text);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fs-btn:hover svg{stroke:var(--accent)}
/* Quand on est en fullscreen, on cache l'icône expand et on montre l'icône réduire */
.fs-btn .ic-expand{display:block}
.fs-btn .ic-reduce{display:none}
body.is-fullscreen .fs-btn .ic-expand{display:none}
body.is-fullscreen .fs-btn .ic-reduce{display:block}
/* Auto-fade quand pas de mouvement */
.fs-btn.idle{opacity:.15}
.fs-btn.idle:hover{opacity:1}

::-webkit-scrollbar{display:none}

/* Petites tailles */
@media (max-height:768px){
  .topbar{height:64px}
  .content{top:64px}
  .tb-logo-img{height:44px}
  .tb-text-l1{font-size:18px}
  .div-card-title{font-size:20px}
  .div-row .nm-name{font-size:13px}
  .div-row .pts{font-size:18px}
  .live-banner-div{font-size:36px}
  .live-row .nm-name{font-size:24px}
  .live-row .pts{font-size:30px}
  .live-row .rk{font-size:32px}
}
</style>
</head>
<body>

<div class="loader" id="loader">
  <img id="loader-logo" class="loader-logo" alt="Logo" src="">
  <div class="loader-text">Chargement…</div>

/* ════════════════════════════════════════════════════════════════════
   HELPERS — Joueurs (compat string OU {name, photo})
   ════════════════════════════════════════════════════════════════════ */
function llPlayerName(p){
  if(!p) return '';
  if(typeof p === 'string') return p;
  if(typeof p === 'object') return p.name || '';
  return String(p);
}
function llPlayerPhoto(p){
  if(!p || typeof p !== 'object') return null;
  return p.photo || null;
}
/* Cherche la photo d'un joueur par son pseudo dans le roster d'une équipe */
function findPlayerPhoto(team, playerName){
  if(!team || !team.players || !playerName) return null;
  const target = String(playerName).trim().toLowerCase();
  for(const p of team.players){
    const norm = llPlayerName(p);
    if(norm && norm.trim().toLowerCase() === target){
      return llPlayerPhoto(p);
    }
  }
  return null;
}

/* ════════════════════════════════════════════════════════════════════
   HELPERS
   ════════════════════════════════════════════════════════════════════ */
function curSplit(){
  const cur = llState.current;
  if(!cur || !cur.year || !cur.split) return null;
  return llState.seasons?.[cur.year]?.splits?.[cur.split] || null;
}
function curTeams(){ return curSplit()?.teams || {}; }

function evaMapResult(pctA, pctB){
  const a = (pctA===null||pctA===undefined||pctA==='') ? null : Number(pctA);
  const b = (pctB===null||pctB===undefined||pctB==='') ? null : Number(pctB);
  if(a===null || b===null) return {empty:true};
  let ptsA=0, ptsB=0;
  if(a===100) ptsA++;
  if(b===100) ptsB++;
  if(a>b) ptsA++;
  else if(b>a) ptsB++;
  else { ptsA++; ptsB++; }
  return { ptsA, ptsB, winnerA: ptsA>ptsB, winnerB: ptsB>ptsA, draw: ptsA===ptsB && a===b, a, b };
}

function computeStandings(monthData, dk){
  if(!monthData) return [];
  const teams = monthData.divisions?.[dk]?.teams || [];
  const matches = monthData.divisions?.[dk]?.matches || {};
  const stats = {};
  teams.forEach(tid=>{
    stats[tid] = { tid, pts:0, mapsW:0, mapsL:0, mapDiff:0, pctDiff:0, played:0, w:0, l:0 };
  });
  Object.values(matches).forEach(mm=>{
    if(mm.status !== 'done' && !mm.finishedAt) return;
    if(!stats[mm.tA] || !stats[mm.tB]) return;
    const sA = mm.scoreA||0, sB = mm.scoreB||0;
    stats[mm.tA].played++; stats[mm.tB].played++;
    stats[mm.tA].mapsW += sA; stats[mm.tA].mapsL += sB;
    stats[mm.tB].mapsW += sB; stats[mm.tB].mapsL += sA;
    if(sA > sB){ stats[mm.tA].pts++; stats[mm.tA].w++; stats[mm.tB].l++; }
    else if(sB > sA){ stats[mm.tB].pts++; stats[mm.tB].w++; stats[mm.tA].l++; }
    (mm.maps||[]).forEach(mp=>{
      const r = evaMapResult(mp?.pctA, mp?.pctB);
      if(r.empty) return;
      stats[mm.tA].pctDiff += (r.a||0) - (r.b||0);
      stats[mm.tB].pctDiff += (r.b||0) - (r.a||0);
    });
  });
  Object.values(stats).forEach(s=>{ s.mapDiff = s.mapsW - s.mapsL; });
  const arr = Object.values(stats);
  arr.sort((a,b)=>{
    if(b.pts !== a.pts) return b.pts - a.pts;
    if(b.mapDiff !== a.mapDiff) return b.mapDiff - a.mapDiff;
    return b.pctDiff - a.pctDiff;
  });
  return arr;
}

function fmtMonth(ym){
  if(!ym) return '';
  const [y,m] = ym.split('-').map(Number);
  return new Date(y, m-1, 1).toLocaleDateString('fr-FR',{month:'long',year:'numeric'}).toUpperCase();
}
function todayYm(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }
function prevMonthYm(ym){ const [y,m]=ym.split('-').map(Number); const d=new Date(y, m-2, 1); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }

/* ════════════════════════════════════════════════════════════════════
   DÉTECTION SOIRÉE LIVE
   ════════════════════════════════════════════════════════════════════ */
function detectLiveEvening(){
  const ov = llState.liveOverride;
  if(ov){
    if(ov.force === false) return null; // forcé en classement général
    if(ov.ym && ov.dk) return { ym: ov.ym, dk: ov.dk };
  }
  const split = curSplit();
  if(!split || !split.months) return null;
  const now = new Date();
  const day = now.getDay();
  const hour = now.getHours();
  let isLive = false, mondayDate = null;
  if(day === 1 && hour >= 19){
    isLive = true; mondayDate = new Date(now);
  } else if(day === 2 && hour < 2){
    isLive = true; mondayDate = new Date(now); mondayDate.setDate(mondayDate.getDate() - 1);
  }
  if(!isLive) return null;
  const mondayIso = `${mondayDate.getFullYear()}-${String(mondayDate.getMonth()+1).padStart(2,'0')}-${String(mondayDate.getDate()).padStart(2,'0')}`;
  for(const ym of Object.keys(split.months)){
    const m = split.months[ym];
    const cal = m.calendar || {};
    for(const dk of ['d1','d2','d3','d4']){
      if(cal[dk] === mondayIso) return { ym, dk };
    }
  }
  return null;
}

/* ════════════════════════════════════════════════════════════════════
   MODE OVERVIEW
   ════════════════════════════════════════════════════════════════════ */
function getRelevantMonth(){
  const split = curSplit();
  if(!split || !split.months) return null;
  const months = Object.keys(split.months).sort();
  if(!months.length) return null;
  const tym = todayYm();
  if(months.includes(tym)) return { ym: tym, data: split.months[tym] };
  const closed = months.filter(ym=>{
    const m = split.months[ym];
    return ['d1','d2','d3','d4'].some(dk=>m.divisions?.[dk]?.closedAt);
  });
  const fallbackYm = closed.length ? closed[closed.length-1] : months[months.length-1];
  return { ym: fallbackYm, data: split.months[fallbackYm] };
}

function renderOverview(){
  const rel = getRelevantMonth();
  const teams = curTeams();

  ['d1','d2','d3','d4'].forEach(dk=>{
    const rowsEl = document.getElementById(`rows-${dk}`);
    const metaEl = document.getElementById(`meta-${dk}`);
    if(!rowsEl) return;
    const cardEl = rowsEl.closest('.div-card');
    if(!rel){
      rowsEl.innerHTML = `<div class="div-empty"><div class="ic">○</div><div class="lb">En attente</div></div>`;
      if(metaEl) metaEl.textContent = '—';
      if(cardEl) cardEl.classList.add('empty');
      return;
    }
    const teamIds = rel.data.divisions?.[dk]?.teams || [];
    if(metaEl) metaEl.innerHTML = `<span>${teamIds.length}</span>/4 ÉQUIPES`;
    if(!teamIds.length){
      rowsEl.innerHTML = `<div class="div-empty"><div class="ic">⌀</div><div class="lb">Division vacante</div></div>`;
      _prevDivRanks[dk] = {};
      if(cardEl) cardEl.classList.add('empty');
      return;
    }
    if(cardEl) cardEl.classList.remove('empty');

    // Si aucun match joué dans cette division → reset prev ranks (évite flash résiduel après reset)
    const matchesObj = rel.data.divisions?.[dk]?.matches || {};
    const anyDone = Object.values(matchesObj).some(mm=>mm.status==='done' || mm.finishedAt);
    if(!anyDone){
      _prevDivRanks[dk] = {};
    }

    const standings = computeStandings(rel.data, dk);
    const newRanks = {};
    standings.forEach((s,i)=>{ newRanks[s.tid] = i+1; });

    // ── FLIP : First (positions actuelles)
    const oldPositions = {};
    rowsEl.querySelectorAll('.div-row[data-tid]').forEach(row=>{
      const tid = row.dataset.tid;
      oldPositions[tid] = row.getBoundingClientRect().top;
    });

    rowsEl.innerHTML = standings.map((s, idx)=>{
      const t = teams[s.tid] || {};
      const rank = idx+1;
      const rkCls = rank===1?'r1':rank===2?'r2':rank===3?'r3':rank===4?'r4':'';
      const rowCls = `div-row ${rkCls}`;
      const mdCls = s.mapDiff > 0 ? 'pos' : s.mapDiff < 0 ? 'neg' : 'zero';
      let flashCls = '';
      const prev = _prevDivRanks[dk]?.[s.tid];
      if(prev && prev !== rank){ flashCls = prev > rank ? 'flash-up' : 'flash-down'; }
      return `
        <div class="${rowCls} ${flashCls}" data-tid="${s.tid}">
          <div class="rk">${String(rank).padStart(2,'0')}</div>
          <div class="lg">${t.logo ? `<img src="${t.logo}" alt="">` : `<span class="lg-empty">${(t.tag||t.name||'?').substring(0,3).toUpperCase()}</span>`}</div>
          <div class="nm">
            <div class="nm-name">${t.name || s.tid}</div>
            ${t.tag ? `<div class="nm-tag">${t.tag}</div>` : ''}
          </div>
          <div class="pts">${s.pts}</div>
          <div class="vd">${s.w}—${s.l}</div>
          <div class="md ${mdCls}">${s.mapDiff>0?'+':''}${s.mapDiff}</div>
        </div>
      `;
    }).join('');

    // ── Last + Invert + Play
    const newRows = rowsEl.querySelectorAll('.div-row[data-tid]');
    newRows.forEach(row=>{
      const tid = row.dataset.tid;
      const oldTop = oldPositions[tid];
      if(oldTop === undefined) return;
      const newTop = row.getBoundingClientRect().top;
      const dy = oldTop - newTop;
      if(Math.abs(dy) < 1) return;
      row.style.transition = 'none';
      row.style.transform = `translateY(${dy}px)`;
    });
    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>{
        newRows.forEach(row=>{
          row.style.transition = '';
          row.style.transform = '';
        });
      });
    });

    _prevDivRanks[dk] = newRanks;
  });
}

/* ════════════════════════════════════════════════════════════════════
   COMPUTE TOP KDA
   ════════════════════════════════════════════════════════════════════ */
function computeTopKDAFromMatchesArrays(arrays){
  const acc = {};
  arrays.forEach(matches=>{
    Object.values(matches).forEach(mm=>{
      if(mm.forfeit) return;
      if(mm.status !== 'done' && !mm.finishedAt) return;
      (mm.maps||[]).forEach(mp=>{
        if(!mp || !mp.kda) return;
        ['A','B'].forEach(side=>{
          const teamId = side==='A' ? mm.tA : mm.tB;
          const players = mp.kda[side] || {};
          Object.entries(players).forEach(([player, st])=>{
            if(!st) return;
            const k=Number(st.k)||0, d=Number(st.d)||0, a=Number(st.a)||0;
            if(k===0 && d===0 && a===0) return;
            const key = `${teamId}__${player}`;
            if(!acc[key]) acc[key] = { player, teamId, k:0, d:0, a:0, maps:0 };
            acc[key].k+=k; acc[key].d+=d; acc[key].a+=a; acc[key].maps++;
          });
        });
      });
    });
  });
  const arr = Object.values(acc).map(x=>{
    const ratio = x.d===0 ? (x.k+x.a) : ((x.k+x.a)/x.d);
    return {...x, ratio};
  });
  arr.sort((a,b)=>b.ratio-a.ratio);
  return arr;
}

function getTopKDASplit(){
  const split = curSplit();
  if(!split?.months) return [];
  const arrays = [];
  Object.values(split.months).forEach(m=>{
    ['d1','d2','d3','d4'].forEach(dk=>{
      if(m.divisions?.[dk]?.matches) arrays.push(m.divisions[dk].matches);
    });
  });
  return computeTopKDAFromMatchesArrays(arrays);
}
function getTopKDAMonth(ym){
  const split = curSplit();
  if(!split?.months || !split.months[ym]) return [];
  const arrays = [];
  ['d1','d2','d3','d4'].forEach(dk=>{
    if(split.months[ym].divisions?.[dk]?.matches) arrays.push(split.months[ym].divisions[dk].matches);
  });
  return computeTopKDAFromMatchesArrays(arrays);
}
function getLastClosedMonthYm(){
  const split = curSplit();
  if(!split?.months) return null;
  const months = Object.keys(split.months).sort();
  const closed = months.filter(ym=>{
    const m = split.months[ym];
    return ['d1','d2','d3','d4'].some(dk=>m.divisions?.[dk]?.closedAt);
  });
  return closed.length ? closed[closed.length-1] : null;
}

/* ════════════════════════════════════════════════════════════════════
   COMPUTE PROMUS / RELÉGUÉS DU MOIS DERNIER
   ════════════════════════════════════════════════════════════════════ */
/**
 * Pour calculer promus/relégués entre M-1 et M (= mois courant ou plus récent),
 * on compare les divisions courantes vs celles du mois précédent.
 * Si pas de mois suivant pour valider, on peut juste exposer le 1er et dernier de chaque div du dernier mois clôturé.
 */
function computePromotionsFromLastClosed(){
  const lastClosedYm = getLastClosedMonthYm();
  if(!lastClosedYm) return { up:[], down:[] };
  const split = curSplit();
  const lastClosed = split.months[lastClosedYm];
  const teams = curTeams();
  const up = []; // équipes qui montent
  const down = []; // équipes qui descendent

  // Pour chaque division on prend le 1er (promu) et le dernier (relégué) selon classement
  ['d1','d2','d3','d4'].forEach(dk=>{
    const stand = computeStandings(lastClosed, dk);
    if(!stand.length) return;
    const first = stand[0];
    const last = stand.length > 1 ? stand[stand.length-1] : null;
    if(dk !== 'd1' && first){ // 1er ne monte pas en D1 (rien au-dessus)... attends si, le 1er de D2 monte en D1. Le 1er de D1 lui ne monte pas
      // 1er de D2/D3/D4 monte
      const t = teams[first.tid] || {};
      const fromDiv = dk;
      const toDiv = dk === 'd2' ? 'd1' : dk === 'd3' ? 'd2' : 'd3';
      up.push({ tid: first.tid, team: t, fromDiv, toDiv });
    }
    if(dk !== 'd4' && last){ // dernier ne descend pas en D4 (rien en-dessous)... attends si, dernier de D1 descend en D2. Le dernier de D4 lui reste
      const t = teams[last.tid] || {};
      const fromDiv = dk;
      const toDiv = dk === 'd1' ? 'd2' : dk === 'd2' ? 'd3' : 'd4';
      down.push({ tid: last.tid, team: t, fromDiv, toDiv });
    }
  });

  return { up: up.slice(0,4), down: down.slice(0,4), monthYm: lastClosedYm };
}

/* ════════════════════════════════════════════════════════════════════
   AUTO-RESIZE TEXTE — réduit la police d'un élément pour qu'il rentre
   ════════════════════════════════════════════════════════════════════ */
/**
 * Réduit progressivement la font-size d'un élément jusqu'à ce que son contenu
 * tienne dans son parent (en largeur ET en hauteur).
 * @param {HTMLElement} el       L'élément à redimensionner
 * @param {number} maxFontPx     Taille de départ (max)
 * @param {number} minFontPx     Taille minimale (au-delà on s'arrête)
 */
function _fitText(el, maxFontPx, minFontPx){
  if(!el) return;
  if(!minFontPx) minFontPx = Math.max(8, Math.round(maxFontPx * 0.55));
  // On ré-applique la taille max d'abord (au cas où on a réduit avant)
  el.style.fontSize = maxFontPx + 'px';
  el.style.whiteSpace = 'nowrap';
  let size = maxFontPx;
  // On cherche la largeur dispo dans le parent
  const parent = el.parentElement;
  if(!parent) return;
  // Marge interne (padding du parent) à respecter
  const parentRect = parent.getBoundingClientRect();
  const cs = window.getComputedStyle(parent);
  const padL = parseFloat(cs.paddingLeft)||0;
  const padR = parseFloat(cs.paddingRight)||0;
  const available = parentRect.width - padL - padR - 4; // -4px pour marge sécurité
  // On réduit tant que le scrollWidth dépasse l'espace dispo
  let safety = 24;
  while(el.scrollWidth > available && size > minFontPx && safety-- > 0){
    size -= 1;
    el.style.fontSize = size + 'px';
  }
  // Si même au minFontPx ça déborde encore : on autorise wrap (deux lignes)
  if(el.scrollWidth > available){
    el.style.whiteSpace = 'normal';
    el.style.lineHeight = '1.05';
  }
}

/**
 * Applique _fitText à tous les éléments correspondant à un sélecteur dans un container.
 * Utile pour traiter d'un coup tous les .rc-mvp-spot-name d'un carrousel.
 */
function _fitAllNames(containerEl, selector, maxFontPx, minFontPx){
  if(!containerEl) return;
  // requestAnimationFrame pour s'assurer que le layout est calculé
  requestAnimationFrame(()=>{
    containerEl.querySelectorAll(selector).forEach(el=>{
      // Si l'élément a une variante "r1" (1er = plus grand), on regarde son parent
      const isR1 = el.closest('.r1');
      const max = isR1 ? maxFontPx.r1 || maxFontPx : (typeof maxFontPx === 'object' ? maxFontPx.normal : maxFontPx);
      _fitText(el, max);
    });
  });
}

/* ════════════════════════════════════════════════════════════════════
   CARROUSEL DROIT — MODE OVERVIEW
   ════════════════════════════════════════════════════════════════════ */
let _ovCarouselIdx = 0;
let _ovCarouselTimer = null;

function getOverviewSlides(){
  // Construit la liste des slides selon ce qui est disponible
  const slides = [];

  // 1) Top MVP — 3 sous-vues (split / dernier mois / mois courant) si données
  const splitTop = getTopKDASplit();
  if(splitTop.length) slides.push({ type:'mvp', subtype:'split', title:'TOP MVP · SPLIT', sub:'CUMUL TOUS MOIS', data: splitTop.slice(0,3) });

  const lastClosedYm = getLastClosedMonthYm();
  if(lastClosedYm){
    const t = getTopKDAMonth(lastClosedYm);
    if(t.length) slides.push({ type:'mvp', subtype:'lastmonth', title:`TOP MVP · ${fmtMonth(lastClosedYm)}`, sub:'MOIS CLÔTURÉ', data: t.slice(0,3) });
  }

  const tym = todayYm();
  const split = curSplit();
  if(split?.months?.[tym]){
    const t = getTopKDAMonth(tym);
    if(t.length) slides.push({ type:'mvp', subtype:'curmonth', title:`TOP MVP · ${fmtMonth(tym)}`, sub:'MOIS EN COURS', data: t.slice(0,3) });
  }

  // 2) Mouvements (promus + relégués fusionnés sur une seule slide)
  const promo = computePromotionsFromLastClosed();
  const hasUp = promo.up && promo.up.length;
  const hasDown = promo.down && promo.down.length;
  if(hasUp || hasDown){
    slides.push({
      type:'movements',
      title:`MOUVEMENTS · ${fmtMonth(promo.monthYm)}`,
      sub:`PROMUS & RELÉGUÉS · ${fmtMonth(promo.monthYm)}`,
      up: promo.up || [],
      down: promo.down || [],
    });
  }

  // 3) Slides infos salle
  const userSlides = Object.entries(llState.slides || {})
    .map(([id,s])=>({id, ...s}))
    .filter(s=>s.active !== false)
    .sort((a,b)=>(a.order||0) - (b.order||0));
  userSlides.forEach(s=>{
    slides.push({ type:'image', title:s.badge||'INFO SALLE', sub:'', data: s });
  });

  return slides;
}

function _slidesFingerprint(slides){
  return slides.map(s=>{
    if(s.type === 'movements'){
      return `movements|${(s.up||[]).length}|${(s.down||[]).length}|${(s.up?.[0]?.tid||'')}|${(s.down?.[0]?.tid||'')}`;
    }
    return `${s.type}|${s.subtype||''}|${(s.data||[]).length}|${(s.data?.[0]?.id || s.data?.[0]?.tid || s.data?.[0]?.player || '')}`;
  }).join('::');
}
let _ovLastFp = '';
function renderOverviewCarousel(){
  const body = document.getElementById('rc-ov-body');
  const dots = document.getElementById('rc-ov-dots');
  const titleEl = document.getElementById('rc-ov-title');
  if(!body || !dots) return;
  const carouselEl = body.closest('.right-carousel');

  const slides = getOverviewSlides();
  if(!slides.length){
    body.innerHTML = `<div class="rc-slide on"><div class="rc-empty"><div class="rc-empty-ic">○</div><div class="rc-empty-lb">EN ATTENTE</div></div></div>`;
    dots.innerHTML = '';
    titleEl.textContent = 'CARROUSEL';
    if(carouselEl) carouselEl.classList.add('empty');
    _ovLastFp = '';
    return;
  }
  if(carouselEl) carouselEl.classList.remove('empty');

  if(_ovCarouselIdx >= slides.length) _ovCarouselIdx = 0;
  const cur = slides[_ovCarouselIdx];
  titleEl.textContent = cur.title;

  const fp = _slidesFingerprint(slides);
  const slideEls = body.querySelectorAll('.rc-slide');

  // Si la liste de slides a changé OU pas encore rendu → re-render complet
  if(fp !== _ovLastFp || slideEls.length !== slides.length){
    body.innerHTML = slides.map((s, idx)=>{
      const onCls = idx === _ovCarouselIdx ? 'on' : '';
      return `<div class="rc-slide ${onCls}" data-idx="${idx}">${renderSlideContent(s)}</div>`;
    }).join('');
    _ovLastFp = fp;
  } else {
    // Sinon : juste bascule de la classe .on / .exiting (animation fluide)
    slideEls.forEach((el, idx)=>{
      const wasOn = el.classList.contains('on');
      const isOn  = idx === _ovCarouselIdx;
      el.classList.remove('exiting');
      if(wasOn && !isOn){
        // celui qui sort
        el.classList.remove('on');
        el.classList.add('exiting');
        // retire 'exiting' après l'animation pour repartir propre
        setTimeout(()=>el.classList.remove('exiting'), 950);
      } else if(!wasOn && isOn){
        el.classList.add('on');
      }
    });
  }

  // Dots
  dots.innerHTML = slides.map((_,i)=>`<div class="rc-h-dot ${i===_ovCarouselIdx?'on':''}"></div>`).join('');

  // Auto-resize uniquement pour les noms d'équipe mouvements (rangée serrée)
  _fitAllNames(body, '.rc-mv-name', 24);
}

function renderSlideContent(slide){
  if(slide.type === 'mvp'){
    const teams = curTeams();
    const top3 = (slide.data || []).slice(0, 3);
    const top3Html = top3.map((p, i)=>{
      const t = teams[p.teamId] || {};
      const rank = i+1;
      const fallback = (t.tag || t.name || '?').substring(0,3).toUpperCase();
      const playerPhoto = findPlayerPhoto(t, p.player);
      const styleAttr = t.logo
        ? `style="--logo-url:url('${t.logo}')"`
        : '';
      const fallbackHtml = (t.logo || playerPhoto)
        ? ''
        : `<div class="rc-mvp-spot-fallback">${fallback}</div>`;
      const photoHtml = playerPhoto
        ? `<div class="rc-mvp-spot-photo" style="background-image:url('${playerPhoto}')"></div>`
        : '';
      const cls = `rc-mvp-spot rc-mvp-spot-big r${rank}${playerPhoto?' has-photo':''}`;
      const mapsCount = p.maps || 0;
      return `
        <div class="${cls}" ${styleAttr}>
          ${fallbackHtml}
          ${photoHtml}
          <div class="rc-mvp-spot-info">
            <div class="rc-mvp-spot-name">${p.player}</div>
            <div class="rc-mvp-spot-team">${t.tag || t.name || ''}</div>
            <div class="rc-mvp-spot-stats">
              <div class="rc-mvp-spot-ratio">${p.ratio.toFixed(2)}</div>
              <div class="rc-mvp-spot-stats-right">
                <div class="rc-mvp-spot-kda">${p.k}/${p.d}/${p.a}</div>
                <div class="rc-mvp-spot-maps">${mapsCount} MAP${mapsCount>1?'S':''}</div>
              </div>
            </div>
          </div>
        </div>
      `;
    }).join('');
    return `
      <div class="rc-mvp-period">${slide.title}<span>${slide.sub}</span></div>
      <div class="rc-mvp-mini rc-mvp-mini-overview">
        <div class="rc-mvp-top3 rc-mvp-top3-only">${top3Html}</div>
      </div>
    `;
  }
  if(slide.type === 'movements'){
    const upRows = (slide.up || []).map(item=>{
      const t = item.team;
      const logoHtml = t.logo
        ? `<img src="${t.logo}" alt="">`
        : `<span class="rc-mv-logo-empty">${(t.tag||t.name||'?').substring(0,3).toUpperCase()}</span>`;
      return `
        <div class="rc-mv-row up">
          <div class="rc-mv-arrow">↑</div>
          <div class="rc-mv-logo">${logoHtml}</div>
          <div class="rc-mv-info">
            <div class="rc-mv-name">${t.name || item.tid}</div>
            <div class="rc-mv-divs"><strong>${item.fromDiv.toUpperCase()}</strong><span class="rc-mv-divs-arrow">→</span><strong>${item.toDiv.toUpperCase()}</strong></div>
          </div>
        </div>
      `;
    }).join('');
    const downRows = (slide.down || []).map(item=>{
      const t = item.team;
      const logoHtml = t.logo
        ? `<img src="${t.logo}" alt="">`
        : `<span class="rc-mv-logo-empty">${(t.tag||t.name||'?').substring(0,3).toUpperCase()}</span>`;
      return `
        <div class="rc-mv-row down">
          <div class="rc-mv-arrow">↓</div>
          <div class="rc-mv-logo">${logoHtml}</div>
          <div class="rc-mv-info">
            <div class="rc-mv-name">${t.name || item.tid}</div>
            <div class="rc-mv-divs"><strong>${item.fromDiv.toUpperCase()}</strong><span class="rc-mv-divs-arrow">→</span><strong>${item.toDiv.toUpperCase()}</strong></div>
          </div>
        </div>
      `;
    }).join('');
    return `
      <div class="rc-mv-header">
        <div class="rc-mv-title">MOUVEMENTS</div>
        <div class="rc-mv-sub">${slide.sub}</div>
      </div>
      <div class="rc-mv-list">
        ${upRows}
        ${downRows}
      </div>
    `;
  }
  if(slide.type === 'image'){
    const s = slide.data;
    const pos = s.imagePos || 'center center';
    return `
      <div class="rc-image" style="background-image:url('${s.image}');background-position:${pos}">
        <div class="rc-image-content">
          ${s.badge ? `<div class="rc-image-badge ${s.accent||'orange'}">${s.badge}</div>` : ''}
          <div class="rc-image-title">${s.title || ''}</div>
          ${s.subtitle ? `<div class="rc-image-subtitle">${s.subtitle}</div>` : ''}
        </div>
      </div>
    `;
  }
  return '';
}

function startOverviewCarousel(){
  if(_ovCarouselTimer){ clearTimeout(_ovCarouselTimer); _ovCarouselTimer = null; }
  function tick(){
    const slides = getOverviewSlides();
    if(!slides.length){
      // rien à afficher → on retente dans 5s
      _ovCarouselTimer = setTimeout(tick, 5000);
      return;
    }
    // Durée du slide courant (avant de switcher) : si infos salle avec duration → on l'utilise, sinon 13s
    const cur = slides[_ovCarouselIdx % slides.length];
    let dur = 13;
    if(cur && cur.type === 'image' && cur.data && cur.data.duration){
      dur = Math.max(3, Math.min(60, parseInt(cur.data.duration) || 13));
    }
    _ovCarouselTimer = setTimeout(()=>{
      _ovCarouselIdx = (_ovCarouselIdx + 1) % slides.length;
      if(_currentMode === 'overview') renderOverviewCarousel();
      tick();
    }, dur * 1000);
  }
  tick();
}

let _liveCarouselIdx = 0;
let _liveCarouselTimer = null;

function renderLive(ym, dk){
  const split = curSplit();
  if(!split) return;
  const monthData = split.months?.[ym];
  if(!monthData) return;
  // Banner
  document.getElementById('live-banner-div').textContent = dk.toUpperCase().slice(1);
  const cal = monthData.calendar?.[dk];
  document.getElementById('live-banner-date').textContent = cal
    ? new Date(cal).toLocaleDateString('fr-FR',{weekday:'long',day:'2-digit',month:'long'}).toUpperCase()
    : '—';

  // Standings
  renderLiveStandings(monthData, dk);
  // Side carousel
  renderLiveCarousel(monthData, dk);
