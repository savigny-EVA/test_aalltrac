<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Savigny Cups — Matchs en cours</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;500;600;700;800;900&family=Orbitron:wght@400;600;700;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root {
  --bg: #080808;
  --bg2: #111111;
  --bg3: #1a1a1a;
  --bg4: #222222;
  --border: rgba(255,255,255,.08);
  --border2: rgba(255,255,255,.15);
  --accent: #E05A3A;
  --accent2: #c44d30;
  --text: #FFFFFF;
  --muted: #666666;
  --muted2: #444444;
  --danger: #FF3333;
  --success: #33CC66;
  --yellow: #F5C842;
  --blue: #4A8FE8;
  --font: 'Barlow Condensed', sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  -webkit-font-smoothing: antialiased;
}

/* ── TOPBAR ── */
.topbar {
  height: 60px;
  min-height: 60px;
  background: var(--bg2);
  border-bottom: 2px solid var(--accent);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 40px;
  position: relative;
  z-index: 10;
}

.tb-logo {
  font-family: var(--font);
  font-size: 22px;
  font-weight: 900;
  letter-spacing: 6px;
  color: var(--text);
  text-transform: uppercase;
}
.tb-logo span { color: var(--accent); }

.tb-title {
  font-family: var(--font);
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 8px;
  text-transform: uppercase;
  color: var(--muted);
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
}

.tb-clock {
  font-family: var(--font);
  font-size: 22px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: 4px;
}

/* ── MAIN LAYOUT ── */
.arenas {
  flex: 1;
  display: grid;
  grid-template-columns: 1fr 1fr;
  overflow: hidden;
  position: relative;
}

/* Mode 1 seule arène : pleine largeur */
.arenas.single-arena {
  grid-template-columns: 1fr;
}

.arena-divider {
  position: absolute;
  left: 50%;
  top: 0;
  bottom: 0;
  width: 1px;
  background: var(--border2);
  z-index: 2;
}

/* ── ARENA PANEL ── */
.arena {
  display: flex;
  flex-direction: column;
  padding: 18px 28px 16px;
  overflow: hidden;
}

.arena-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}

.arena-badge {
  font-family: var(--font);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 4px;
  text-transform: uppercase;
  padding: 6px 14px;
  background: var(--accent);
  color: var(--text);
}

.arena-title {
  font-family: var(--font);
  font-size: 20px;
  font-weight: 900;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: var(--text);
}

/* ── MATCH EN COURS ── */
.match-display {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* ── TEAM LOGOS ── */
.team-logo {
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;
  background-color: var(--bg3);
  flex-shrink: 0;
  border: 1px solid var(--border2);
}

/* XL : VS block (match en cours) */
.team-logo-xl {
  width: clamp(72px, 8vw, 110px);
  height: clamp(72px, 8vw, 110px);
}

/* MD : maps cards & pending rows */
.team-logo-md {
  width: 44px;
  height: 44px;
}

/* SM : pending matches compact */
.team-logo-sm {
  width: 38px;
  height: 38px;
}

/* Placeholder (initiales) si pas de logo */
.team-logo-placeholder {
  background: linear-gradient(135deg, var(--bg3), var(--bg4));
  border: 1px solid var(--border2);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  font-family: var(--font);
  font-weight: 900;
  letter-spacing: 1px;
  color: var(--accent);
  text-transform: uppercase;
}

.team-logo-placeholder.xl {
  width: clamp(72px, 8vw, 110px);
  height: clamp(72px, 8vw, 110px);
  font-size: clamp(22px, 2.5vw, 36px);
}

.team-logo-placeholder.md {
  width: 44px;
  height: 44px;
  font-size: 14px;
}

.team-logo-placeholder.sm {
  width: 38px;
  height: 38px;
  font-size: 12px;
}

/* VS Block */
.match-time-banner {
  font-family: var(--font);
  font-size: clamp(14px, 1.6vw, 20px);
  font-weight: 900;
  letter-spacing: 4px;
  color: var(--accent);
  text-transform: uppercase;
  padding: 6px 12px;
  background: rgba(224,90,58,.08);
  border-left: 3px solid var(--accent);
  align-self: flex-start;
}

.vs-block {
  background: var(--bg2);
  border-left: 3px solid var(--accent);
  padding: 18px 24px;
  display: flex;
  align-items: center;
  gap: 16px;
}

.vs-team {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 16px;
  min-width: 0;
}

.vs-team.right {
  flex-direction: row-reverse;
  text-align: right;
}

.vs-team-info {
  display: flex;
  flex-direction: column;
  min-width: 0;
  flex: 1;
}

.vs-team-name {
  font-family: var(--font);
  font-size: clamp(1.4rem, 2.5vw, 2.4rem);
  font-weight: 900;
  letter-spacing: 3px;
  text-transform: uppercase;
  line-height: 1;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.vs-team-role {
  font-family: var(--font);
  font-size: 11px;
  letter-spacing: 3px;
  text-transform: uppercase;
  font-weight: 800;
  margin-top: 4px;
}

.vs-team-role.rebels { color: var(--yellow); }
.vs-team-role.alliance { color: var(--blue); }
.vs-team-role.tbd { color: var(--muted); }

.vs-sep {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 28px;
  gap: 6px;
}

.vs-label {
  font-family: var(--font);
  font-size: 13px;
  letter-spacing: 6px;
  color: var(--muted);
  font-weight: 800;
  text-transform: uppercase;
}

.vs-phase {
  font-family: var(--font);
  font-size: 11px;
  letter-spacing: 3px;
  color: var(--muted);
  text-transform: uppercase;
  font-weight: 700;
}

/* SETUP INFO */
.match-setup {
  display: flex;
  align-items: center;
  gap: 12px;
}

.setup-pill {
  font-family: var(--font);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 2px;
  text-transform: uppercase;
  padding: 4px 10px;
  border-left: 3px solid;
}

.setup-pill.side-yellow { background: rgba(245,200,66,.08); color: var(--yellow); border-color: var(--yellow); }
.setup-pill.side-blue { background: rgba(74,143,232,.08); color: var(--blue); border-color: var(--blue); }
.setup-pill.skin { background: var(--bg3); color: var(--text); border-color: var(--muted2); }

/* MAPS PICKS */
.maps-section {
  display: flex;
  flex-direction: column;
  gap: 8px;
  flex: 1;
}

.maps-label {
  font-family: var(--font);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 4px;
  color: var(--muted);
  text-transform: uppercase;
}

.maps-row {
  display: flex;
  gap: 8px;
  flex: 1;
}

.map-card {
  flex: 1;
  position: relative;
  overflow: hidden;
  border-left: 3px solid;
  min-height: 70px;
  max-height: 110px;
}

.map-card.rebels { border-color: var(--yellow); }
.map-card.alliance { border-color: var(--blue); }

.map-card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: brightness(.5);
  position: absolute;
  inset: 0;
}

.map-card-info {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  padding: 10px 12px;
  background: linear-gradient(transparent, rgba(0,0,0,.95));
  z-index: 1;
  display: flex;
  align-items: flex-end;
  gap: 10px;
}

.map-card-info-text {
  flex: 1;
  min-width: 0;
}

.map-card-team-logo {
  width: 36px;
  height: 36px;
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;
  flex-shrink: 0;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,.6));
}

.map-card-team-logo.placeholder {
  background: linear-gradient(135deg, rgba(0,0,0,.6), rgba(0,0,0,.8));
  border: 1px solid rgba(255,255,255,.2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font);
  font-weight: 900;
  font-size: 11px;
  letter-spacing: 0;
  color: var(--text);
}

.map-card-num {
  font-family: var(--font);
  font-size: 10px;
  font-weight: 700;
  color: var(--muted);
  letter-spacing: 3px;
  text-transform: uppercase;
}

.map-card-name {
  font-family: var(--font);
  font-size: clamp(11px, 1.5vw, 16px);
  font-weight: 900;
  letter-spacing: 2px;
  text-transform: uppercase;
  line-height: 1.1;
  margin-top: 2px;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.map-card-team {
  display: none;
}

.map-card.rebels .map-card-team { color: var(--yellow); }
.map-card.alliance .map-card-team { color: var(--blue); }

/* Indicateur de couleur (rebels/alliance) sur le logo */
.map-card .map-card-team-logo {
  border-radius: 50%;
  background-color: rgba(0,0,0,.4);
}

.map-card.rebels .map-card-team-logo {
  box-shadow: 0 0 0 2px var(--yellow), 0 2px 6px rgba(0,0,0,.6);
}

.map-card.alliance .map-card-team-logo {
  box-shadow: 0 0 0 2px var(--blue), 0 2px 6px rgba(0,0,0,.6);
}

/* PB En attente */
.pb-pending {
  background: var(--bg2);
  border-left: 3px solid var(--muted2);
  padding: 16px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.pb-pending-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--accent);
  flex-shrink: 0;
  animation: blink 1.5s infinite;
}

.pb-pending-text {
  font-family: var(--font);
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--muted);
}

@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }

/* No match */
.no-match {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  color: var(--muted);
}

.no-match-icon { font-size: 3rem; opacity: .2; }

.no-match-text {
  font-family: var(--font);
  font-size: 14px;
  font-weight: 800;
  letter-spacing: 5px;
  text-transform: uppercase;
}

/* ── BOTTOM BAR ── */
.bottom-bar {
  height: 90px;
  min-height: 90px;
  background: var(--bg2);
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 40px;
  gap: 32px;
  position: relative;
  z-index: 10;
}

.qr-section {
  display: flex;
  align-items: center;
  gap: 16px;
}

.qr-box {
  background: #fff;
  padding: 6px;
  flex-shrink: 0;
}

.qr-info { display: flex; flex-direction: column; gap: 4px; }

.qr-label {
  font-family: var(--font);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 4px;
  color: var(--accent);
  text-transform: uppercase;
}

.qr-sub {
  font-family: var(--font);
  font-size: 11px;
  font-weight: 600;
  color: var(--muted);
  letter-spacing: 2px;
  text-transform: uppercase;
}



.next-match-arena.a1 { background: #E05A3A; }
.next-match-arena.a2 { background: #8B2E18; }

/* Matchs en attente dans la colonne */
.pending-matches {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 8px;
}

.pending-label {
  font-family: var(--font);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 4px;
  color: var(--muted2);
  text-transform: uppercase;
  padding: 12px 0 8px;
  border-top: 1px solid var(--border);
}

.pending-match-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  background: var(--bg2);
  border-left: 3px solid var(--muted2);
}

.pending-match-row.is-next {
  border-left-color: var(--accent);
  background: rgba(224,90,58,.05);
}

.pending-match-time {
  font-family: var(--font);
  font-size: 16px;
  font-weight: 800;
  color: var(--accent);
  letter-spacing: 2px;
  width: 60px;
  flex-shrink: 0;
}

.pending-match-teams {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: var(--font);
  font-size: 18px;
  font-weight: 900;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text);
  min-width: 0;
}

.pending-match-team {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 1;
  min-width: 0;
}

.pending-match-team.right {
  flex-direction: row-reverse;
  text-align: right;
}

.pending-match-team-name {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
  min-width: 0;
}

.pending-match-vs {
  color: var(--muted);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 1px;
  flex-shrink: 0;
  padding: 0 4px;
}

.pending-match-tag {
  font-family: var(--font);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--muted);
  flex-shrink: 0;
}

.pending-match-row.is-next .pending-match-tag {
  color: var(--accent);
}

.pending-match-row.pb-done-tag {
  border-left-color: var(--success);
}

.pending-match-row.pb-done-tag .pending-match-tag {
  color: var(--success);
}

/* Toggle admin "Afficher les logos" : on cache TOUT logo/placeholder d'équipe */
body.no-logos .team-logo,
body.no-logos .team-logo-placeholder,
body.no-logos .map-card-team-logo { display: none !important; }
</style>
</head>
<body>

<div class="topbar">
  <div class="tb-logo">SAVIGNY <span>CUPS</span></div>
  <div class="tb-title">Matchs en cours</div>
  <div class="tb-clock" id="clock">--:--:--</div>
</div>

<div id="eta-banner-mt" style="display:none;background:linear-gradient(135deg,rgba(224,90,58,0.15),rgba(224,90,58,0.05));border-bottom:2px solid rgba(224,90,58,0.45);padding:10px 24px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:18px;letter-spacing:1px;text-align:center;color:#fff"></div>

<div class="arenas">
  <div class="arena arena-1" id="arena1">
    <div class="arena-header">
      <div class="arena-badge">Arène 1</div>
      <div class="arena-title">Arène 1</div>
    </div>
    <div class="match-display" id="arena1-content">
      <div class="no-match">
        <div class="no-match-icon">⚡</div>
        <div class="no-match-text">En attente d'un match</div>
      </div>

    </div>

<script>
const firebaseConfig={apiKey:"AIzaSyCledoOZLCns1tBxGO3OIhcsjvFpBFYCss",authDomain:"savigny-cups.firebaseapp.com",databaseURL:"https://savigny-cups-default-rtdb.europe-west1.firebasedatabase.app",projectId:"savigny-cups",storageBucket:"savigny-cups.firebasestorage.app",messagingSenderId:"1000985455974",appId:"1:1000985455974:web:14ea84601120553d7ceca7"};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();

/* ── CLOCK ── */
function updateClock(){
  const now=new Date();
  const h=now.getHours().toString().padStart(2,'0');
  const m=now.getMinutes().toString().padStart(2,'0');
  const s=now.getSeconds().toString().padStart(2,'0');
  document.getElementById('clock').textContent=h+':'+m+':'+s;
}
setInterval(updateClock,1000);
updateClock();

/* ── QR CODE ── */
new QRCode(document.getElementById('qr-box'),{
  text:'https://savigny-cups.netlify.app/captain.html',
  width:72,height:72,
  colorDark:'#000000',colorLight:'#ffffff',
  correctLevel:QRCode.CorrectLevel.H
});

/* ── DATA ── */
let tournamentData=null;
let pickbanData={};
let teamLogos={};

/* ══ ETA / LIVE TIMING ══ */
function durationFromFormat(fmt){
  switch(fmt){
    case 'bo1':   return 10;
    case '2maps': return 20;
    case 'bo3':   return 30;
    case 'bo5':   return 50;
    default:      return 30;
  }
}
function computeEtas(state){
  if(!state || !state.started){
    return {
      deltaByArena:{1:0, 2:0},
      endOfPools:null,
      endOfBracket:null,
      projectedTime: m => ({time: (m && m.time) || '', delta: 0, color: 'neutral'})
    };
  }
  const poolDur = state.poolMatchDuration || durationFromFormat(state.poolFormat||'bo3');
  function matchDuration(m, isBracket){
    if(isBracket && m.format) return durationFromFormat(m.format);
    return poolDur;
  }
  function timeToMin(t){
    if(!t) return null;
    const [h, mn] = t.split('h').map(Number);
    return h*60 + (mn||0);
  }
  function minToTime(m){
    const hh = Math.floor(m/60)%24;
    const mm = ((m%60)+60)%60;
    return String(hh).padStart(2,'0')+'h'+String(mm).padStart(2,'0');
  }
  const deltaByArena = {1:0, 2:0};
  const lastFinishedByArena = {1:null, 2:null};
  Object.values(state.matches||{}).forEach(poolMs=>{
    const arr = Array.isArray(poolMs) ? poolMs : Object.values(poolMs);
    arr.forEach(m=>{
      if(!m.done || !m.finishedAt || !m.time) return;
      const arena = m.arena || 1;
      const last = lastFinishedByArena[arena];
      if(!last || timeToMin(m.time) > timeToMin(last.time)){
        lastFinishedByArena[arena] = m;
      }
    });
  });
  [1,2].forEach(arena=>{
    const m = lastFinishedByArena[arena];
    if(!m) return;
    const plannedEndMin = timeToMin(m.time) + matchDuration(m, false);
    const finishedDate = new Date(m.finishedAt);
    const realEndMin = finishedDate.getHours()*60 + finishedDate.getMinutes();
    deltaByArena[arena] = realEndMin - plannedEndMin;
  });
  let endOfPoolsMin = null;
  let endOfPoolsDelta = 0;
  const lastPlannedByArena = {1:null, 2:null};
  Object.values(state.matches||{}).forEach(poolMs=>{
    const arr = Array.isArray(poolMs) ? poolMs : Object.values(poolMs);
    arr.forEach(m=>{
      if(!m.time) return;
      const arena = m.arena || 1;
      const tm = timeToMin(m.time);
      const last = lastPlannedByArena[arena];
      if(!last || tm > timeToMin(last.time)) lastPlannedByArena[arena] = m;
    });
  });
  [1,2].forEach(arena=>{
    const m = lastPlannedByArena[arena];
    if(!m) return;
    const projected = timeToMin(m.time) + matchDuration(m, false) + (deltaByArena[arena]||0);
    if(endOfPoolsMin===null || projected > endOfPoolsMin){
      endOfPoolsMin = projected;
      endOfPoolsDelta = deltaByArena[arena] || 0;
    }
  });
  const endOfPools = endOfPoolsMin!==null ? { time: minToTime(endOfPoolsMin), delta: endOfPoolsDelta } : null;
  const bracketDelta = Math.max(deltaByArena[1]||0, deltaByArena[2]||0);
  let endOfBracketMin = null;
  const bk = state.bracket || {};
  const allBkMatches = [];
  if(Array.isArray(bk.winnerRounds)) bk.winnerRounds.forEach(r=>r.matches&&r.matches.forEach(m=>m&&!m.isBye&&allBkMatches.push(m)));
  if(Array.isArray(bk.loserRounds))  bk.loserRounds.forEach(r=>r.matches&&r.matches.forEach(m=>m&&!m.isBye&&allBkMatches.push(m)));
  if(bk.grandFinal) allBkMatches.push(bk.grandFinal);
  allBkMatches.forEach(m=>{
    if(!m || !m.time) return;
    const projected = timeToMin(m.time) + matchDuration(m, true) + bracketDelta;
    if(endOfBracketMin===null || projected > endOfBracketMin) endOfBracketMin = projected;
  });
  const endOfBracket = endOfBracketMin!==null ? { time: minToTime(endOfBracketMin), delta: bracketDelta } : null;
  function projectedTime(m, opts){
    opts = opts || {};
    const isBracket = opts.isBracket || false;
    if(!m || !m.time) return {time:'', delta:0, color:'neutral'};
    if(m.done) return {time: m.time, delta: 0, color: 'neutral'};
    const arena = m.arena || 1;
    const delta = isBracket ? bracketDelta : (deltaByArena[arena] || 0);
    const projectedMin = timeToMin(m.time) + delta;
    const color = delta < -2 ? 'green' : (delta > 2 ? 'red' : 'neutral');
    return { time: minToTime(projectedMin), delta, color };
  }
  return { deltaByArena, endOfPools, endOfBracket, projectedTime };
}
function renderEtaBanner(state){
  const etas = computeEtas(state);
  if(!etas.endOfPools && !etas.endOfBracket) return '';
  function fmtDelta(d){
    if(Math.abs(d)<=2) return '';
    const sign = d>0 ? '+' : '';
    return ' <span style="font-size:0.8em;opacity:0.85">('+sign+d+' min)</span>';
  }
  function clr(d){
    if(d < -2) return '#22c55e';
    if(d > 2)  return '#ef4444';
    return 'inherit';
  }
  const parts = [];
  if(etas.endOfPools){
    const c = clr(etas.endOfPools.delta);
    parts.push('<span>Fin des poules : <strong style="color:'+c+'">'+etas.endOfPools.time+'</strong>'+fmtDelta(etas.endOfPools.delta)+'</span>');
  }
  if(etas.endOfBracket){
    const c = clr(etas.endOfBracket.delta);
    parts.push('<span>Fin du tournoi : <strong style="color:'+c+'">'+etas.endOfBracket.time+'</strong>'+fmtDelta(etas.endOfBracket.delta)+'</span>');
  }
  return parts.join(' &nbsp;•&nbsp; ');
}
function updateEtaBanner(){
  const banner = document.getElementById('eta-banner-mt');
  if(!banner) return;
  const html = renderEtaBanner(tournamentData);
  if(html){ banner.innerHTML = html; banner.style.display='block'; }
  else { banner.style.display='none'; }
}
/* ══ FIN ETA ══ */

function getMid(match){
  const raw=match.l||(match.pool+'_'+match.slot);
  return raw.replace(/[^a-zA-Z0-9_-]/g,'_');
}

function slugMap(name){
  return name.toLowerCase().replace(/ /g,'-');
}

function escAttr(s){
  return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* Récupère le logo d'une équipe avec fuzzy match insensible à la casse */
function teamLogo(name){
  if(!name) return null;
  if(teamLogos[name]) return teamLogos[name];
  const low=name.toLowerCase();
  for(const k of Object.keys(teamLogos)){
    if(k.toLowerCase()===low) return teamLogos[k];
  }
  return null;
}

/* Initiales d'une équipe (max 2 lettres) */
function teamInitials(name){
  if(!name) return '?';
  const parts=name.trim().split(/\s+/);
  if(parts.length>=2) return (parts[0][0]+parts[1][0]).toUpperCase();
  return name.substring(0,2).toUpperCase();
}

/* HTML d'un logo d'équipe (XL / md / sm) */
function logoHtml(name, size){
  const url=teamLogo(name);
  if(url){
    return `<div class="team-logo team-logo-${size}" style="background-image:url('${escAttr(url)}')"></div>`;
  }
  return `<div class="team-logo-placeholder ${size}">${teamInitials(name)}</div>`;
}

/* ── RENDER ARENA ── */
function renderMatchCard(m, pbData, isActive){
  const mid=getMid(m);
  const pb=pbData[mid]||null;
  const pbDone=pb&&pb.status==='done';
  const rebelsTeam=pb?pb.rebels:'';
  const allianceTeam=pb?pb.alliance:'';
  const isARebels=m.tA===rebelsTeam;
  const phase=m.pool?`Poule ${m.pool}`:m.l||'Match';

  if(isActive){
    // Match en cours — affichage complet avec logos
    // ETA : projeter l'heure (vert si avance, rouge si retard)
    const isBracketM = !!m.l;
    const _etaA = computeEtas(tournamentData).projectedTime(m, {isBracket: isBracketM});
    const _etaColorA = _etaA.color === 'green' ? '#22c55e' : (_etaA.color === 'red' ? '#ef4444' : '');
    const _etaStyleA = _etaColorA ? `style="color:${_etaColorA}"` : '';
    const matchTime=_etaA.time||m.time||'—';
    const vsHtml=`
      <div class="match-time-banner" ${_etaStyleA}>⏱ ${matchTime}</div>
      <div class="vs-block">
        <div class="vs-team">
          ${logoHtml(m.tA,'xl')}
          <div class="vs-team-info">
            <div class="vs-team-name">${m.tA||'—'}</div>
            ${pbDone?`<div class="vs-team-role ${isARebels?'rebels':'alliance'}">${isARebels?'★ Rebels':'◆ Alliance'}</div>`:'<div class="vs-team-role tbd">P&B à faire</div>'}
          </div>
        </div>
        <div class="vs-sep">
          <div class="vs-label">VS</div>
          <div class="vs-phase">${phase}</div>
        </div>
        <div class="vs-team right">
          ${logoHtml(m.tB,'xl')}
          <div class="vs-team-info">
            <div class="vs-team-name">${m.tB||'—'}</div>
            ${pbDone?`<div class="vs-team-role ${!isARebels?'rebels':'alliance'}">${!isARebels?'★ Rebels':'◆ Alliance'}</div>`:'<div class="vs-team-role tbd">—</div>'}
          </div>
        </div>
      </div>`;

    let setupHtml='';
    if(pbDone&&pb.skin){
      const rawSkin=(pb.skin||'').toLowerCase().replace(/s$/,'');
      const skinName=rawSkin.charAt(0).toUpperCase()+rawSkin.slice(1);
      setupHtml=`<div class="match-setup">
        <img src="/images/skins/close-${rawSkin}.webp" alt="${skinName}" style="width:48px;height:48px;object-fit:cover;flex-shrink:0;" onerror="this.style.display='none'">
        <div class="setup-pill skin">${skinName}</div>
      </div>`;
    }

    let mapsHtml='';
    if(pbDone){
      const picks=Object.values(pb.actions||{}).filter(a=>a.type==='pick');
      if(picks.length>0){
        mapsHtml=`<div class="maps-section">
          <div class="maps-label">Maps sélectionnées</div>
          <div class="maps-row">
            ${picks.map((a,i)=>{
              const isR=a.team===pb.rebels||a.who==='rebels';
              const teamName=isR?rebelsTeam:allianceTeam;
              const mapSlug=slugMap(a.map);
              const tLogoUrl=teamLogo(teamName);
              const tLogoHtml=tLogoUrl
                ? `<div class="map-card-team-logo" style="background-image:url('${escAttr(tLogoUrl)}')" title="${escAttr(teamName)}"></div>`
                : `<div class="map-card-team-logo placeholder" title="${escAttr(teamName)}">${teamInitials(teamName)}</div>`;
              return `<div class="map-card ${isR?'rebels':'alliance'}">
                <img src="/images/maps/${mapSlug}.webp" alt="${escAttr(a.map)}" onerror="this.style.display='none'">
                <div class="map-card-info">
                  <div class="map-card-info-text">
                    <div class="map-card-num">Map ${i+1}</div>
                    <div class="map-card-name">${a.map}</div>
                  </div>
                  ${tLogoHtml}
                </div>
              </div>`;
            }).join('')}
          </div>
        </div>`;
      }
    } else {
      const statusLabel=!pb?'Pick & Ban non démarré':
        pb.status==='pfc'?'PFC en cours...':
        pb.status==='role'?'Choix du rôle...':
        pb.status==='alliance_setup'?'Config Alliance...':
        pb.status==='ongoing'?'Bans & Picks en cours...':'—';
      mapsHtml=`<div class="pb-pending">
        <div class="pb-pending-dot"></div>
        <div class="pb-pending-text">${statusLabel}</div>
      </div>`;
    }

    return vsHtml+setupHtml+mapsHtml;
  } else {
    // Match en attente — ligne compacte avec logos
    // ETA : projeter l'heure (vert si avance, rouge si retard)
    const _isBracketP = !!m.l;
    const _etaP = computeEtas(tournamentData).projectedTime(m, {isBracket: _isBracketP});
    const _etaColorP = _etaP.color === 'green' ? '#22c55e' : (_etaP.color === 'red' ? '#ef4444' : '');
    const _etaStyleP = _etaColorP ? `style="color:${_etaColorP}"` : '';
    const _projTimeP = _etaP.time || m.time || '—';
    const pbTag=pbDone?'P&B ✓':'À venir';
    const pbClass=pbDone?'pb-done-tag':'';
    return `<div class="pending-match-row ${pbClass}">
      <div class="pending-match-time" ${_etaStyleP}>${_projTimeP}</div>
      <div class="pending-match-teams">
        <div class="pending-match-team">
          ${logoHtml(m.tA,'sm')}
          <div class="pending-match-team-name">${m.tA||'?'}</div>
        </div>
        <div class="pending-match-vs">VS</div>
        <div class="pending-match-team right">
          ${logoHtml(m.tB,'sm')}
          <div class="pending-match-team-name">${m.tB||'?'}</div>
        </div>
      </div>
      <div class="pending-match-tag">${pbTag}</div>
    </div>`;
  }
}

function renderArena(arenaId, matches, pbData){
  const el=document.getElementById('arena'+arenaId+'-content');
  if(!matches.length){
    el.innerHTML=`<div class="no-match"><div class="no-match-icon">⚡</div><div class="no-match-text">Aucun match</div></div>`;
    return;
  }

  const pending=matches.filter(m=>!m.done);
  const done=matches.filter(m=>m.done);

  if(!pending.length){
    el.innerHTML=`<div class="no-match"><div class="no-match-icon">✓</div><div class="no-match-text">Poule terminée</div></div>`;
    return;
  }

  // Le premier non-joué = match actif
  const active=pending[0];
  const rest=pending.slice(1);

  let html=renderMatchCard(active, pbData, true);

  const restVisible=rest.slice(0,3);
  const restHidden=rest.length-restVisible.length;
  if(restVisible.length>0){
    html+=`<div class="pending-matches">
      <div class="pending-label">En attente · ${rest.length} match${rest.length>1?'s':''}</div>
      ${restVisible.map(m=>renderMatchCard(m, pbData, false)).join('')}
      ${restHidden>0?`<div style="font-family:var(--font);font-size:12px;font-weight:700;letter-spacing:3px;color:var(--muted2);text-transform:uppercase;padding:8px 12px;">+ ${restHidden} autre${restHidden>1?'s':''}</div>`:''}
    </div>`;
  }

  el.innerHTML=html;
}

/* Parse "HHhMM" → minutes depuis minuit. Robuste : si le format ne matche pas,
   tombe sur Number.MAX_SAFE_INTEGER pour mettre le match en fin de liste plutôt
   que tout casser. Utilise le regex /\d+/g pour bypasser variations (ex: "14h00", "14:00", "14h"). */
function parseTimeMin(t){
  if(!t) return Number.MAX_SAFE_INTEGER;
  const nums=String(t).match(/\d+/g);
  if(!nums||nums.length===0) return Number.MAX_SAFE_INTEGER;
  const h=parseInt(nums[0])||0;
  const m=nums.length>1?(parseInt(nums[1])||0):0;
  return h*60+m;
}

/* Tri stable des matchs par heure croissante (matchs sans heure → en fin) */
function sortByTime(arr){
  return arr.map((m,i)=>({m,i})).sort((a,b)=>{
    const ta=parseTimeMin(a.m.time);
    const tb=parseTimeMin(b.m.time);
    if(ta!==tb) return ta-tb;
    return a.i-b.i; // stable
  }).map(x=>x.m);
}

/* ── HELPERS schéma nouveau ── */
// Sépare tous les matchs en 2 arènes en utilisant le champ m.arena rempli par
// le scheduler côté admin (source de vérité). Fallback sur l'index seulement
// si m.arena est absent (anciens tournois). À l'intérieur de chaque arène, les
// matchs sont triés par heure croissante via sortByTime.
function splitArenas(data){
  if(!data) return [[],[]];
  const a1=[], a2=[];
  const arenaCount=parseInt(data.arenaCount)||2;
  // Un match n'est affiché que si ses 2 équipes sont réelles (pas TBD/BYE)
  const isReal=m=>m&&m.tA&&m.tB&&m.tA!=='TBD'&&m.tB!=='TBD'&&m.tA!=='BYE'&&m.tB!=='BYE';

  // Helper : aiguille un match dans la bonne arène en lisant m.arena en
  // priorité. Si arenaCount===1, tout va sur a1. Si m.arena absent, fallback
  // sur la valeur passée en paramètre (ex: index de la poule).
  function dispatch(m, fallbackArena){
    if(arenaCount===1){ a1.push(m); return; }
    const arena=parseInt(m.arena)||fallbackArena||1;
    (arena===2?a2:a1).push(m);
  }

  // Poules : on parcourt toutes les poules et on dispatch chaque match
  // selon son champ arena (source de vérité du scheduler).
  if(data.matches && typeof data.matches==='object'){
    const pids=Object.keys(data.matches).sort();
    pids.forEach((pid,i)=>{
      const arr=Array.isArray(data.matches[pid])?data.matches[pid]:Object.values(data.matches[pid]||{});
      // Fallback : pour le cas "≥2 poules + 2 arènes" sans champ arena, on
      // alterne par index de poule (poule 0/A → A1, poule 1/B → A2, etc.)
      const fallbackArena=(pids.length>1)?(i%2===0?1:2):1;
      arr.filter(Boolean).forEach(m=>dispatch(m,fallbackArena));
    });
  }
  // Bracket
  if(data.bracket){
    const bk=data.bracket;
    // Winner et grandFinal partent par défaut sur A1 ; loserRounds sur A2
    // (sauf si m.arena force autre chose).
    (bk.winnerRounds||[]).forEach(r=>(r.matches||[]).forEach(m=>{ if(isReal(m)) dispatch(m,1); }));
    (bk.loserRounds||[]).forEach(r=>(r.matches||[]).forEach(m=>{ if(isReal(m)) dispatch(m,arenaCount===1?1:2); }));
    if(isReal(bk.grandFinal)) dispatch(bk.grandFinal,1);
  }

  // Tri final par heure croissante. Matchs sans heure → fin de liste.
  // C'est ce qui garantit que l'écran affiche les matchs dans l'ordre de
  // passage, peu importe l'ordre de stockage Firebase ou l'ordre de poule.
  return [sortByTime(a1), sortByTime(a2)];
}

/* Applique ou retire la classe CSS "single-arena" sur le conteneur .arenas
   selon arenaCount, pour masquer l'arène 2 quand il n'y en a qu'une. */
function applyArenaLayout(data){
  const arenaCount=parseInt(data&&data.arenaCount)||2;
  const container=document.querySelector('.arenas');
  const a2=document.getElementById('arena2');
  const divider=document.querySelector('.arena-divider');
  if(!container) return;
  if(arenaCount===1){
    container.classList.add('single-arena');
    if(a2) a2.style.display='none';
    if(divider) divider.style.display='none';
  } else {
    container.classList.remove('single-arena');
    if(a2) a2.style.display='';
    if(divider) divider.style.display='';
  }
}

/* ── LISTENERS ── */
function startListening(){
  db.ref('tournament').on('value',snap=>{
    tournamentData=snap.val();
    if(!tournamentData||!tournamentData.started) return;
    teamLogos=tournamentData.teamLogos||{};
    // Toggle admin : afficher / masquer les logos d'équipe (par défaut activé)
    const showLogos = tournamentData.showLogos === undefined || tournamentData.showLogos === null ? true : !!tournamentData.showLogos;
    document.body.classList.toggle('no-logos', !showLogos);
    applyArenaLayout(tournamentData);
    const [a1,a2]=splitArenas(tournamentData);
    renderArena(1, a1, pickbanData);
    renderArena(2, a2, pickbanData);
    updateEtaBanner();
  });

  db.ref('tournament/teamLogos').on('value',snap=>{
    teamLogos=snap.val()||{};
    if(!tournamentData||!tournamentData.started) return;
    applyArenaLayout(tournamentData);
    const [a1,a2]=splitArenas(tournamentData);
    renderArena(1, a1, pickbanData);
    renderArena(2, a2, pickbanData);
    updateEtaBanner();
  });

  db.ref('pickban').on('value',snap=>{
    pickbanData=snap.val()||{};
    if(!tournamentData||!tournamentData.started) return;
    applyArenaLayout(tournamentData);
    const [a1,a2]=splitArenas(tournamentData);
    renderArena(1, a1, pickbanData);
    renderArena(2, a2, pickbanData);
    updateEtaBanner();
  });
}

startListening();
